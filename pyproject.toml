[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rxyy-mcp"
version = "0.1.0"
description = "Remote console for coding agents: ask, answer, dispatch, takeover."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "rxyy" }]
dependencies = [
  "pywebview>=5.0",
  "markdown>=3.5",
  "segno>=1.6",
]

[project.optional-dependencies]
sdk = ["cursor-sdk>=1.0.24"]
dev = ["pytest>=8.0"]

[project.scripts]
rxyy-mcp = "rxyy_mcp.cli:main"

[tool.setuptools.packages.find]
include = ["rxyy_mcp*"]

[tool.setuptools.package-data]
rxyy_mcp = [
  "*.html",
  "*.js",
  "*.cjs",
  "*.wav",
  "*.txt",
  "extbus-ext/**",
  "agentboard/**",
  "console/**",
  "src/**",
]
