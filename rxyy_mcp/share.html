/* 请求带超时：手机切基站/隧道抖动时 fetch 能挂住好几分钟，
   轮询循环就此停摆，界面看着像「死了」。超时后本轮放弃，下一拍照常。 */
async function api(path, payload, ms) {
  const url = path + (path.includes("?") ? "&" : "?") + "t=" + encodeURIComponent(TOKEN);
  const opt = payload
    ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) }
    : {};
  opt.cache = "no-store";
  let timer = null;
  if (window.AbortController) {
    const ctl = new AbortController();
    opt.signal = ctl.signal;
    timer = setTimeout(() => ctl.abort(), ms || 20000);
  }
  try {
    const res = await fetch(url, opt);
    if (res.status === 403) throw new Error("这条链接的权限不够或已失效（单会话链接看不到别的会话）");
    return await res.json();
  } finally {
    if (timer) clearTimeout(timer);
  }
}

function toast(text, ok) {
  const t = $("toast");
  t.textContent = text;
  t.className = ok ? "show ok" : "show";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = "", 2600);
}

function activeSession() {
  return state.sessions.find(s => s.id === activeId) || null;
}

// 与控制台一致：优先用 hub 每秒算好的存活判定结论（live_state），
// tab 点、清单、团队面板一套逻辑，不再各判各的
const LIVE_DOT = {
  waiting: "ready", working: "work", stalled: "busystale",
  recent: "live", ide: "live",
  died: "dead", dead: "dead", lost: "dead", recon: "recon",
  turn_done: "idle", online: "idle", unknown: "idle", idle: "idle",
};

function dotStateOf(s) {
  const busyAlive = s.connected && !s.pending && s.processing_secs != null && s.heartbeat_alive;
  if (s.death_reason) return "dead";
  if (s.live_state && LIVE_DOT[s.live_state]) {
    if (s.live_state === "working" && busyAlive && !s.agent_status) return "busy";
    return LIVE_DOT[s.live_state];
  }
  const working = s.connected && !s.pending && s.agent_status;
  return !s.connected ? (s.reconnecting ? "recon" : (s.ide_active ? "live" : "dead"))
    : s.pending ? "ready"
    : working ? "work"
    : busyAlive ? "busy"
    : (s.processing_secs != null ? "busystale" : "idle");
}

function dotTitleOf(s, st) {
  if (s.takeover_pending) {
    // 派了接手还没落地：手机上派的单，手机上也得看得见在途（08-12 实测
    // 接手方被晾着，用户毫不知情）
    return "已派「" + (s.takeover_pending.to_name || "?") + "」接手，等它报到（已等 "
      + Math.max(1, Math.round((s.takeover_pending.age || 0) / 60)) + " 分钟）";
  }
  if (s.archived) {
    return s.end_kind === "handover"
      ? "控制台自动收起（判定活已交接）；它若还在干活，下次上报会自动回来"
      : "你手动关闭的会话";
  }
  if (s.live_label) return s.live_label;
  return st === "work" ? ("AI 干活中：" + s.agent_status + (s.agent_activity ? " · " + s.agent_activity : ""))
    : st === "ready" ? "AI 正等你回复"
    : st === "busy" ? "AI 正在处理你的消息"
    : st === "recon" ? "连接闪断，自动重连中…"
    : st === "live" ? "对话在 IDE 里仍活跃，通道未接"
    : st === "dead" ? "会话已终止"
    : st === "busystale" ? "已交 AI，心跳暂停(可能在切换)"
    : "待机中";
}

// 死会话再分「待续 / 已结束」，跟桌面一套逻辑：待续=真活+近两天动过+没完工，
// 排在活人之后、已结束之前，手机上一眼能找回过夜没干完的会话
const RESUME_IDLE_MAX = 2 * 86400;
function deadBucket(s) {
  if (s.id === activeId) return null;
  if (s.archived) return "ended";   // 用户在控制台关掉的，别再冒充「待续」
  if (dotStateOf(s) !== "dead") return null;
  // idle_secs 为空 = 没心跳记录的老会话 → 归已结束，不冒充待续
  const resumable = s.real && !s.done
    && s.idle_secs != null && s.idle_secs < RESUME_IDLE_MAX;
  return resumable ? "resume" : "ended";
}

function matchFilter(s) {
  if (!filterText) return true;
  return ((s.label || "") + " " + (s.name || "") + " " + (s.cwd || "")).toLowerCase()
    .includes(filterText);
}

function orderedSessions() {
  const live = [], resume = [], gone = [];
  for (const s of state.sessions) {
    if (!matchFilter(s) && s.id !== activeId) continue;
    const b = deadBucket(s);
    (b === "resume" ? resume : b === "ended" ? gone : live).push(s);
  }
  resume.sort((a, b) => (a.idle_secs == null ? 9e9 : a.idle_secs)
                       - (b.idle_secs == null ? 9e9 : b.idle_secs));
  return { live, resume, gone };
}

function unseenOf(s) {
  return s.id === activeId ? 0 : Math.max(0, (s.rev || 0) - (seenRev[s.id] || 0));
}

/* ---------- 会话列表：原地打补丁，不再每拍重建 ----------
   老做法是每次轮询 innerHTML="" 重建全部 tab。20 多个会话时每秒扔掉再造上百个
   节点：手机上既费电又吃触摸（手指按下的那个节点被换掉，click 就没了），
   还把侧栏滚动位置顶回去。现在按 id 复用节点，只改真正变了的那几个字段。 */
const tabNodes = new Map();   // sid -> {el, dot, wtag, nm, badge, sig}
let lastOrderSig = "";

function makeTabNode(s) {
  const el = document.createElement("div");
  el.className = "tab";
  el.dataset.sid = s.id;
  const dot = document.createElement("span");
  dot.className = "dot";
  const wtag = document.createElement("span");
  wtag.className = "wtag";
  wtag.title = "窗口标记：同号 = 同一个工作区目录的 Cursor 窗口";
  const nm = document.createElement("span");
  nm.className = "tname";
  const badge = document.createElement("span");
  badge.className = "badge";
  const schip = document.createElement("span");
  schip.className = "schip";
  schip.style.display = "none";
  const more = document.createElement("button");
  more.className = "more";
  more.textContent = "⋯";
  more.title = "这个对话能干的事";
  more.onclick = e => { e.stopPropagation(); openSheet(s.id); };
  el.append(dot, wtag, nm, schip, badge, more);
  let longFired = false;
  // 走 tapBind：鼠标按下即换，手指得抬手才算，滑动列表不再顺手切走会话
  tapBind(el, ev => {
    if (longFired) { longFired = false; return; }   // 长按已经开过菜单了
    if (ev && (ev.target === more || more.contains(ev.target))) return;
    selectSession(s.id);
  });
  let press = null;
  const cancelPress = () => { clearTimeout(press); press = null; };
  el.addEventListener("touchstart", () => {
    longFired = false;
    press = setTimeout(() => { press = null; longFired = true; openSheet(s.id); }, 480);
  }, { passive: true });
  el.addEventListener("touchend", cancelPress);
  el.addEventListener("touchmove", cancelPress);
  el.addEventListener("touchcancel", cancelPress);
  el.oncontextmenu = e => { e.preventDefault(); openSheet(s.id); };
  return { el, dot, wtag, nm, badge, schip, sig: "" };
}

function patchTabNode(n, s) {
  const st = dotStateOf(s);
  const unseen = unseenOf(s);
  const label = (s.peer_ip ? "🌐 " : "") + (s.label || s.name);
  const ls = (s.live_step && s.live_step.live && !s.archived) ? s.live_step : null;
  const sig = [st, label, s.wtag || "", unseen, s.id === activeId ? 1 : 0,
               s.live_label || "", s.agent_status || "", s.agent_activity || "",
               ls ? (ls.n + ":" + ls.label + ":" + ls.status) : ""].join("|");
  if (n.sig === sig) return;
  n.sig = sig;
  if (n.schip) {
    // 一句话进度：「▶ 第 12 步 · 运行命令」（读 Cursor 库还原的最后一步）
    if (ls) {
      const ico = ls.kind === "thinking" ? "💭" : ls.kind === "error" ? "⚠" : ls.kind === "text" ? "✎"
        : ((typeof LT_ICONS !== "undefined" && LT_ICONS[ls.tool]) || "");
      n.schip.textContent = (ico ? ico + " " : "") + "第 " + ls.n + " 步 · " + ls.label;
      n.schip.title = ls.summary || "";
      n.schip.className = "schip" + (ls.status === "running" ? " running" : "");
      n.schip.style.display = "";
    } else {
      n.schip.style.display = "none";
    }
  }
  n.el.classList.toggle("active", s.id === activeId);
  n.dot.className = "dot " + st;
  n.dot.title = dotTitleOf(s, st);
  n.wtag.textContent = s.wtag || "";
  n.nm.textContent = label;
  n.nm.title = (s.peer_ip ? "来自 " + s.peer_ip + "\n" : "")
    + (s.label && s.label !== s.name ? "标签名：" + s.name + "\n" : "") + (s.cwd || s.name);
  n.badge.textContent = unseen ? (unseen > 9 ? "9+" : unseen) : "";
  n.badge.style.display = unseen ? "" : "none";
}

function makeGroup(text, cls, onclick) {
  const g = document.createElement(onclick ? "button" : "div");
  g.className = "tgroup" + (cls ? " " + cls : "");
  g.textContent = text;
  if (onclick) g.onclick = onclick;
  return g;
}

function renderSessions() {
  $("allCount").textContent = state.sessions.length;
  const od = orderedSessions();
  const seq = [];
  for (const s of od.live) seq.push(s);
  if (od.resume.length) {
    seq.push({ group: "⏸ 待续 · " + od.resume.length, cls: "resume" });
    for (const s of od.resume) seq.push(s);
  }
  if (od.gone.length) {
    seq.push({ group: (goneOpen ? "▾ " : "▸ ") + "已结束 · " + od.gone.length, toggle: true });
    if (goneOpen) for (const s of od.gone) seq.push(s);
  }

  const box = $("tabs");
  const orderSig = seq.map(x => x.group || x.id).join(",");
  if (orderSig !== lastOrderSig) {
    lastOrderSig = orderSig;
    const keepScroll = box.scrollTop;
    const frag = document.createDocumentFragment();
    const keep = new Set();
    for (const x of seq) {
      if (x.group) {
        frag.appendChild(makeGroup(x.group, x.cls, x.toggle ? () => {
          goneOpen = !goneOpen;
          localStorage.setItem("share_gone_open", goneOpen ? "1" : "0");
          lastOrderSig = "";
          renderSessions();
        } : null));
        continue;
      }
      keep.add(x.id);
      let n = tabNodes.get(x.id);
      if (!n) { n = makeTabNode(x); tabNodes.set(x.id, n); }
      frag.appendChild(n.el);
    }
    for (const [sid, n] of tabNodes) {
      if (!keep.has(sid)) { n.el.remove(); tabNodes.delete(sid); }
    }
    box.textContent = "";
    box.appendChild(frag);
    if (!seq.length) {
      const tip = document.createElement("div");
      tip.className = "tgroup";
      tip.textContent = filterText ? "（没有匹配的会话）" : "（还没有会话）";
      box.appendChild(tip);
    }
    box.scrollTop = keepScroll;   // 排序变动不该把你滚到的位置顶回顶部
  }
  for (const x of seq) if (!x.group) patchTabNode(tabNodes.get(x.id), x);

  // 手机上侧栏收着，未读只能靠 ☰ 上那个小红点提醒
  const anyUnseen = state.sessions.some(s => unseenOf(s) > 0);
  $("menuBtn").classList.toggle("has-unread", anyUnseen);
  renderHeader();
}

function renderHeader() {
  const s = activeSession();
  const dot = $("curTitle").firstElementChild;
  const nm = $("curTitle").lastElementChild;
  const sub = $("curSub");
  if (!s) {
    dot.className = "dot idle";
    if (nm.textContent !== "rxyy-mcp") nm.textContent = "rxyy-mcp";
    const t = offline ? "连接断开" : "选择一个对话";
    if (sub.textContent !== t) sub.textContent = t;
    return;
  }
  const st = dotStateOf(s);
  const cls = "dot " + st;
  if (dot.className !== cls) dot.className = cls;
  const label = (s.wtag ? s.wtag + " " : "") + (s.peer_ip ? "🌐 " : "") + (s.label || s.name);
  if (nm.textContent !== label) nm.textContent = label;
  const t = dotTitleOf(s, st) + (s.agent_activity ? "｜" + s.agent_activity : "");
  if (sub.textContent !== t) sub.textContent = t;
  if (nm.title !== (s.cwd || "")) nm.title = s.cwd || "";
}

/* ---------- 每会话一份消息视图：切 tab 直接换显示，不等网络 ---------- */
const views = new Map();       // sid -> {el, sigs, rev, loaded, fetching}
const VIEW_CACHE = 6;          // 缓存几个会话的 DOM（够来回切，又不至于吃内存）

function ensureView(sid) {
  let v = views.get(sid);
  if (!v) {
    const el = document.createElement("div");
    el.className = "mlist";
    el.dataset.sid = sid;
    $("msgs").appendChild(el);
    v = { el, sigs: [], rev: -1, loaded: false, fetching: false };
    el.addEventListener("scroll", () => { if (sid === activeId) updateJump(); }, { passive: true });
  } else {
    views.delete(sid);   // 重新插到队尾 = 标记为最近使用
  }
  views.set(sid, v);
  for (const [k, old] of views) {
    if (views.size <= VIEW_CACHE) break;
    if (k === sid || k === activeId) continue;
    old.el.remove();
    views.delete(k);
  }
  return v;
}

function showView(sid) {
  for (const [k, v] of views) v.el.classList.toggle("on", k === sid);
}

function atBottom(el) {
  return el.scrollHeight - el.scrollTop - el.clientHeight < 80;
}

/* 读 scrollHeight 会强制同步排版。切会话时那一读要把刚显示出来的整条消息列表
   全排一遍——实测在手机级 CPU 上单这一句就 400ms+，正好卡在手指按下那一下。
   挪到下一帧：浏览器该排的照排，但按下去的那一刻先把界面换过去。
   顺带合并滚动事件里的连续调用。 */
let jumpRaf = 0;
function updateJump() {
  if (jumpRaf) return;
  jumpRaf = requestAnimationFrame(() => {
    jumpRaf = 0;
    const v = activeId && views.get(activeId);
    $("jumpBtn").classList.toggle("on", !!(v && v.loaded && !atBottom(v.el)));
  });
}

/* 贴到底部。图片是 lazy 的，落位后列表还会再长高一截，
   所以隔两帧再校一次，否则停在离底还差几屏的地方。 */
function pinBottom(el) {
  el.scrollTop = el.scrollHeight;
  requestAnimationFrame(() => {
    el.scrollTop = el.scrollHeight;
    requestAnimationFrame(() => { el.scrollTop = el.scrollHeight; });
  });
}

function buildMsg(m, sid) {
  const div = document.createElement("div");
  div.className = "msg " + m.role + (m.role === "user" && m.who ? " remote" : "");
  if (m.role !== "sys") {
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = (m.role === "ai" ? "AI" : (m.who ? m.who : "发起人")) + " · " + m.ts;
    div.appendChild(meta);
  }
  if (m.role === "user" && m.selected && m.selected.length) {
    const tags = document.createElement("div");
    tags.className = "sel-tags";
    for (const t of m.selected) {
      const tag = document.createElement("span");
      tag.className = "sel-tag";
      tag.textContent = "✓ " + t;
      tags.appendChild(tag);
    }
    div.appendChild(tags);
  }
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  if (m.queued) bubble.classList.add("queued");
  if (m.cancelled) bubble.classList.add("cancelled");
  bubble.innerHTML = m.html || "";
  if (m.role === "user" && m.is_continue) {
    bubble.innerHTML = "<i>▶ " + (bubble.textContent || "继续") + "</i>";
  }
  if (!bubble.innerHTML && m.role === "user") bubble.innerHTML = "<i>(仅选项/图片)</i>";
  if (m.role === "ai") addCodeCopyButtons(bubble);
  enhanceBubble(bubble, sid);
  div.appendChild(bubble);
  if (m.role === "user" && m.queued) {
    const q = document.createElement("div");
    q.className = "queue-note";
    const label = document.createElement("span");
    const recallUntil = Number(m.recall_until || 0);
    const buffering = recallUntil > Date.now() / 1000;
    label.textContent = buffering
      ? "↩ 发送缓冲中 · 可撤回"
      : "⏳ 排队中 · AI 就绪后自动发送";
    if (buffering) setTimeout(() => {
      if (label.isConnected) label.textContent = "⏳ 排队中 · AI 就绪后自动发送";
    }, Math.max(0, recallUntil * 1000 - Date.now()) + 50);
    q.appendChild(label);
    if (m.qid && myQids.has(m.qid)) {
      const cancel = document.createElement("span");
      cancel.className = "queue-cancel";
      cancel.textContent = "撤回";
      cancel.onclick = async () => {
        let r;
        try { r = await api("/api/unqueue", { sid: sid, qid: m.qid }); }
        catch (e) { toast("撤回失败"); return; }
        if (r && r.restore) restoreUnqueued(sid, r.restore);
        const v = views.get(sid);
        if (v) v.rev = -1;
        await tick(true);
      };
      q.appendChild(cancel);
    }
    div.appendChild(q);
  }
  if (m.role === "user" && m.cancelled) {
    const c = document.createElement("div");
    c.className = "queue-note cancelled";
    c.textContent = "已撤回";
    div.appendChild(c);
  }
  if (m.role === "ai" && m.options && m.options.length) {
    const chips = document.createElement("div");
    chips.className = "opt-chips";
    for (const o of m.options) {
      const c = document.createElement("span");
      c.className = "opt-chip";
      c.textContent = o;
      chips.appendChild(c);
    }
    div.appendChild(chips);
  }
  if (m.role === "user" && m.img_files && m.img_files.length) {
    const wrap = document.createElement("div");
    wrap.className = "img-thumbs";
    for (const p of m.img_files) {
      const src = "/api/image?sid=" + encodeURIComponent(sid)
        + "&path=" + encodeURIComponent(p) + "&t=" + encodeURIComponent(TOKEN);
      const im = document.createElement("img");
      im.loading = "lazy";
      im.decoding = "async";
      im.src = src;
      im.onclick = () => openLightbox(src);
      im.onerror = () => {
        const n = document.createElement("div");
        n.className = "img-note";
        n.textContent = "📷 图片加载失败";
        im.replaceWith(n);
      };
      wrap.appendChild(im);
    }
    div.appendChild(wrap);
  } else if (m.role === "user" && m.img_count) {
    const n = document.createElement("div");
    n.className = "img-note";
    n.textContent = "📷 " + m.img_count + " 张图片";
    div.appendChild(n);
  }
  if (m.role === "user" && m.file_names && m.file_names.length) {
    const n = document.createElement("div");
    n.className = "file-note";
    n.textContent = "📎 " + m.file_names.join("、");
    div.appendChild(n);
  }
  return div;
}

/* 增量渲染：只重建真正变了的那几条。
   老做法每次 rev 一动就 innerHTML="" 整条重来——一条几十 KB 的长对话，
   手机上要重排上百个节点、重跑全部语法高亮，肉眼可见地卡一下。
   常见情形其实只是「尾部多了一条」，这里就只 append 一个节点。 */
function renderMessages(v, msgs, sid) {
  msgs = msgs || [];
  const sigs = msgs.map(m => JSON.stringify(m));
  let prev = v.sigs;
  const box = v.el;
  // hub 只在内存留最近 N 条，老消息会被裁掉 —— 先把头对齐再比
  if (prev.length && sigs.length && prev[0] !== sigs[0]) {
    const at = prev.indexOf(sigs[0]);
    if (at > 0) {
      for (let k = 0; k < at; k++) box.removeChild(box.firstChild);
      prev = prev.slice(at);
    } else {
      box.textContent = "";
      prev = [];
    }
  }
  let i = 0;
  while (i < prev.length && i < sigs.length && prev[i] === sigs[i]) i++;
  while (box.childNodes.length > i) box.removeChild(box.lastChild);
  if (i < sigs.length) {
    const frag = document.createDocumentFragment();
    for (let k = i; k < sigs.length; k++) frag.appendChild(buildMsg(msgs[k], sid));
    box.appendChild(frag);
  }
  v.sigs = sigs;
  return i < sigs.length || prev.length !== sigs.length;
}

function selectSession(id) {
  if (activeId === id) { closeDrawer(); return; }
  // 走之前先把压着的那一枪补出去：草稿按会话存，而下面就要清空输入框，
  // 等定时器自己点火时框里装的已经是新会话的字了（打完字 0.8 秒内切会话是常态）。
  flushDraftSave();
  activeId = id;
  selected = []; images = []; files = [];
  $("ta").value = "";
  autoGrow();
  bumpMedia();
  // 先把界面切过去（有缓存就是上次那一屏，没有就是空白骨架），再去拉数据。
  // 老做法是等 /api/messages 回来才换画面，隧道上百来毫秒就成了「点了没反应」。
  const v = ensureView(id);
  showView(id);
  $("empty").style.display = "none";
  $("msgs").style.display = "";
  $("inputArea").style.display = "flex";
  renderSessions();
  updateJump();
  closeDrawer();
  const s = activeSession();
  if (s) renderInput(s);
  refreshActive(true);
}

function neighborSession(dir) {
  const od = orderedSessions();
  const seq = [...od.live, ...od.resume, ...od.gone];
  const i = seq.findIndex(s => s.id === activeId);
  if (i < 0) return null;
  const j = i + dir;
  return j >= 0 && j < seq.length ? seq[j].id : null;
}

function openDrawer() { document.body.classList.add("drawer"); }
function closeDrawer() { document.body.classList.remove("drawer"); }

/* 会话栏宽度可拖。会话名普遍长过 244px，默认一律截断看不全全名；
   拖过的宽度记在本地，换设备各自一档。 */
const SIDE_W_MIN = 170, SIDE_W_MAX = 560, SIDE_W_DEFAULT = 244;

function setSideWidth(px, save) {
  const w = Math.round(Math.min(SIDE_W_MAX, Math.max(SIDE_W_MIN, px)));
  document.documentElement.style.setProperty("--side-w", w + "px");
  if (save) localStorage.setItem("share_side_w", String(w));
}

function bindSideGrip() {
  const saved = parseInt(localStorage.getItem("share_side_w") || "", 10);
  if (saved) setSideWidth(saved, false);
  const grip = $("sideGrip");
  let dragging = false;
  grip.addEventListener("pointerdown", e => {
    if (e.button !== 0) return;
    dragging = true;
    document.body.classList.add("resizing");
    e.preventDefault();
    // 捕获放最后并兜住异常：它一抛错就会把上面那两句连坐掉，拖拽当场失灵
    try { grip.setPointerCapture(e.pointerId); } catch (err) {}
  });
  grip.addEventListener("pointermove", e => {
    // 侧栏贴着左边缘，指针的 clientX 就是它该有的宽度
    if (dragging) setSideWidth(e.clientX, false);
  });
  const stop = e => {
    if (!dragging) return;
    dragging = false;
    try { grip.releasePointerCapture(e.pointerId); } catch (err) {}
    document.body.classList.remove("resizing");
    setSideWidth(parseInt(getComputedStyle(document.documentElement)
      .getPropertyValue("--side-w"), 10) || SIDE_W_DEFAULT, true);
  };
  grip.addEventListener("pointerup", stop);
  grip.addEventListener("pointercancel", stop);
  grip.addEventListener("dblclick", () => setSideWidth(SIDE_W_DEFAULT, true));
}

/* 输入框高度可拖。默认跟着内容长，拖过一次就锁在你定的高度，双击解锁。 */
const TA_H_MIN = 44;

function bindTaGrip() {
  const saved = parseInt(localStorage.getItem("share_ta_h") || "", 10);
  if (saved) { taPinned = saved; document.body.classList.add("ta-pinned"); }
  const grip = $("taGrip");
  if (!grip) return;
  let dragging = false, startY = 0, startH = 0;
  grip.addEventListener("pointerdown", e => {
    if (e.button !== 0) return;
    dragging = true;
    startY = e.clientY;
    startH = $("ta").offsetHeight;
    document.body.classList.add("resizing-v");
    e.preventDefault();
    try { grip.setPointerCapture(e.pointerId); } catch (err) {}
  });
  grip.addEventListener("pointermove", e => {
    if (!dragging) return;
    // 手柄在输入框上方，往上拖 = 变高
    taPinned = Math.min(taMaxHeight(140), Math.max(TA_H_MIN, startH + (startY - e.clientY)));
    autoGrow();
  });
  const stop = e => {
    if (!dragging) return;
    dragging = false;
    try { grip.releasePointerCapture(e.pointerId); } catch (err) {}
    document.body.classList.remove("resizing-v");
    localStorage.setItem("share_ta_h", String(Math.round(taPinned)));
  };
  grip.addEventListener("pointerup", stop);
  grip.addEventListener("pointercancel", stop);
  grip.addEventListener("dblclick", () => {
    taPinned = 0;
    localStorage.removeItem("share_ta_h");
    autoGrow();
  });
  addEventListener("resize", autoGrow);
}

/* ---------- 团队面板（把控制台那块搬到手机） ---------- */
let teamRoles = [];
let teamRoots = [];   // 已知项目根目录，用于「把这个 agent 划到哪个项目」

function rootPicker(a) {
  // 常见场景：某个工作区闲下来的 agent 被叫来做另一个项目的功能。它报到时带的是
  // 自己工作区，控制台只能按那个分组——于是团队面板显示得跟实际分工对不上。
  // 这里让人手动把它划过去；划过去后仍会亮「⚠ 人在 XX」——它能改本项目的文件，
  // 但得走绝对路径，Cursor 的代码上下文还在它自己那个工作区。
  const sel = document.createElement("select");
  const roots = teamRoots.slice();
  if (a.agent_cwd && !roots.includes(a.agent_cwd)) roots.push(a.agent_cwd);
  for (const r of roots) {
    const op = document.createElement("option");
    op.value = r;
    op.textContent = "归属：" + (r.split(/[\\/]/).filter(Boolean).pop() || r);
    if (r === (a.affiliation || a.workspace_path || a.agent_cwd || a.task_root)) op.selected = true;
    sel.appendChild(op);
  }
  sel.onchange = async () => {
    const r = await api("/api/team/root", { sid: a.id, root: sel.value });
    (r && r.ok) ? toast("已划到 " + (r.task_root || "").split(/[\\/]/).pop(), true)
                : toast((r && r.error) || "改归属失败");
    renderTeam();
  };
  return sel;
}

function teamAgentRow(a) {
  const box = document.createElement("div");
  box.className = "tag";
  const nm = document.createElement("span");
  nm.className = "nm";
  nm.textContent = (a.wtag ? a.wtag + " " : "") + (a.label || a.name);
  box.appendChild(nm);
  if (a.seat) {
    const sb = document.createElement("span");
    sb.className = "rb";
    sb.textContent = a.seat;
    box.appendChild(sb);
  }
  const ws = document.createElement("div");
  ws.className = "st";
  ws.textContent = "工作区 · " + (a.workspace || a.agent_project || "未知")
    + (a.workspace_path || a.agent_cwd ? "（" + (a.workspace_path || a.agent_cwd) + "）" : "");
  box.appendChild(ws);
  if (a.crossed) {
    const xb = document.createElement("span");
    xb.className = "xb";
    xb.textContent = "⚠ 人在 " + (a.workspace || a.agent_project || "别处");
    xb.title = "这个 agent 的 Cursor 窗口在 " + (a.agent_cwd || a.workspace_path || "?")
      + "\n它能改本项目的文件，但要走绝对路径（代码上下文不在这边）";
    box.appendChild(xb);
  }
  // 它在任务面板领的卡：面板上唯一一处不是它自己说的项目证据
  for (const c of (a.cards || [])) {
    const cb = document.createElement("span");
    cb.className = "rb";
    cb.textContent = "🎫 " + (c.project || c.title || "卡");
    cb.title = (c.title || "") + "（" + (c.status === "in_review" ? "待验收" : "处理中") + "）";
    box.appendChild(cb);
  }
  // 自报项目跟领的卡对不上：只摆事实，分组仍按自报走
  if (a.fact_warn) {
    const fw = document.createElement("div");
    fw.className = "st";
    fw.style.color = "#b45309";
    fw.style.whiteSpace = "normal";
    fw.textContent = "⚠ " + a.fact_warn + "——别按 tab 名当它是本项目的人";
    box.appendChild(fw);
  }
  const sel = document.createElement("select");
  for (const o of [{ key: "", label: "（无角色）" }].concat(teamRoles)) {
    const op = document.createElement("option");
    op.value = o.key; op.textContent = o.label;
    if (o.key === (a.role || "")) op.selected = true;
    sel.appendChild(op);
  }
  sel.onchange = async () => {
    const r = await api("/api/team/role", { sid: a.id, role: sel.value });
    (r && r.ok) ? toast("角色已改", true) : toast((r && r.error) || "改角色失败");
    renderTeam();
  };
  box.appendChild(sel);
  box.appendChild(rootPicker(a));
  const asg = document.createElement("input");
  asg.className = "asg";
  asg.value = a.assign || "";
  asg.placeholder = "负责哪块功能（回车保存）";
  asg.onkeydown = async e => {
    if (e.key !== "Enter") return;
    const r = await api("/api/team/assign", { sid: a.id, text: asg.value });
    (r && r.ok) ? toast("分工已存（接手时自动继承）", true) : toast((r && r.error) || "保存失败");
  };
  box.appendChild(asg);
  const st = document.createElement("div");
  st.className = "st";
  st.textContent = (a.live_label || "") + (a.activity ? "｜" + a.activity : "")
    + (a.death ? "｜⚠ 挂了：" + (a.death.reason || "") : "");
  box.appendChild(st);
  if (a.files && a.files.length) {
    const fl = document.createElement("div");
    fl.className = "fl";
    fl.textContent = "占着：" + a.files.join("、");
    box.appendChild(fl);
  }
  const ops = document.createElement("div");
  ops.className = "ops";
  const go = document.createElement("button");
  go.textContent = "打开";
  go.onclick = () => { selectSession(a.id); $("teamModal").style.display = "none"; };
  ops.appendChild(go);
  const menu = document.createElement("button");
  menu.textContent = "⋯ 接手/复制";
  menu.onclick = () => { $("teamModal").style.display = "none"; openSheet(a.id); };
  ops.appendChild(menu);
  if (a.role === "impl" || a.role === "owner") {
    const rv = document.createElement("button");
    rv.textContent = "送审";
    rv.onclick = async () => {
      const r = await api("/api/team/review_send", { sid: a.id });
      (r && r.ok) ? toast("已送审给：" + (r.sent || []).join("、"), true)
                  : toast((r && r.error) || "送审失败");
    };
    ops.appendChild(rv);
  }
  if (a.role === "review") {
    for (const [label, verdict] of [["回执:通过", "pass"], ["回执:打回", "fail"]]) {
      const b = document.createElement("button");
      b.textContent = label;
      b.onclick = async () => {
        const r = await api("/api/team/verdict", { sid: a.id, verdict: verdict });
        (r && r.ok) ? toast("回执已发", true) : toast((r && r.error) || "回执失败");
      };
      ops.appendChild(b);
    }
  }
  box.appendChild(ops);
  return box;
}

function teamError(why) {
  const body = $("teamBody");
  body.innerHTML = "";
  const p = document.createElement("div");
  p.className = "pmeta";
  p.textContent = "读团队数据失败：" + why + "\n（控制台重启的那几十秒里会这样，重试一下就好）";
  p.style.whiteSpace = "pre-wrap";
  body.appendChild(p);
  const b = document.createElement("button");
  b.className = "sact";
  b.textContent = "重试";
  b.onclick = renderTeam;
  body.appendChild(b);
}

async function renderTeam() {
  const body = $("teamBody");
  body.textContent = "加载中…";
  let r;
  try { r = await api("/api/team"); } catch (e) { teamError(e.message); return; }
  if (!r || !r.ok) { teamError((r && r.error) || "接口没返回数据"); return; }
  teamRoles = r.roles || [];
  teamRoots = (r.projects || []).map(p => p.root).filter(Boolean);
  body.innerHTML = "";
  const legacyRelays = (r.legacy_relays || []).slice().reverse();
  if (!(r.projects || []).length && !legacyRelays.length) {
    body.textContent = "（还没有 agent 接入）";
    return;
  }
  // 工作流仍按真实工作区根保存；同一根拆成多个团队项目后只展示一次，
  // 不迁移/复制链条，更不能让它在每个项目卡里重复出现。
  const workflowRootsShown = new Set();
  const liveProjects = (r.projects || []).filter(p => !p.history);
  const histProjects = (r.projects || []).filter(p => p.history);
  for (const p of liveProjects) {
    const box = document.createElement("div");
    box.className = "tp";
    const h = document.createElement("div");
    h.className = "ph";
    h.textContent = p.name + "　" + (p.alive || 0) + " 在干活 / " + (p.online || 0) + " 在线"
      + (p.ended ? " · 已结束 " + p.ended : "");
    box.appendChild(h);
    const meta = document.createElement("div");
    meta.className = "pmeta";
    const wss = p.workspaces || [];
    meta.textContent = wss.length
      ? ("工作区 · " + wss.map(w => (w.name || "") + (w.path ? "（" + w.path + "）" : "")).join(" · "))
      : (p.root || "");
    box.appendChild(meta);
    if (p.board) {
      const bd = document.createElement("div");
      bd.className = "board";
      bd.textContent = "📌 " + p.board;
      box.appendChild(bd);
    }
    // 团队黑板：agent 自动上报的重大情况（部署/大改/提交/卡住/事故/收工），新在前
    const bl = (p.bulletin || []).slice().reverse();
    for (const x of bl.slice(0, 6)) {
      const row = document.createElement("div");
      row.className = "pmeta";
      row.style.whiteSpace = "normal";
      row.textContent = "📋 " + (x.day || "") + " " + (x.hms || "") + "〔" + (x.kind || "?")
        + "〕" + (x.from_label || x.from8 || "?") + "：" + (x.text || "");
      box.appendChild(row);
    }
    // 工作流任务链：进度一目了然，躺床上也能 继续/确认完成/重派
    const wfNorm = v => String(v || "").toLowerCase().replace(/\//g, "\\").replace(/\\+$/, "");
    const WFI = { pending: "○", running: "▶", done: "✓", stuck: "⚠", skipped: "➖" };
    const WFS = { draft: "草稿", running: "运行中", paused: "已暂停", stuck: "卡住", done: "已完成" };
    const workspaceWorkflows = workflowRootsShown.has(wfNorm(p.root)) ? []
      : (r.workflows || []).filter(x => wfNorm(x.root) === wfNorm(p.root));
    workflowRootsShown.add(wfNorm(p.root));
    for (const w of workspaceWorkflows) {
      const row = document.createElement("div");
      row.className = "tag";
      const nm = document.createElement("span");
      nm.className = "nm";
      nm.textContent = "⛓ " + w.name + "（" + (WFS[w.status] || w.status) + "）";
      row.appendChild(nm);
      const st = document.createElement("div");
      st.className = "st";
      st.textContent = (w.steps || []).map(s =>
        (WFI[s.status] || "○") + s.title
        + (s.status === "running" && s.assigned_label ? "(" + s.assigned_label + ")" : "")
      ).join(" → ");
      row.appendChild(st);
      const lg = (w.log || []).slice(-1)[0];
      if (lg) {
        const lgd = document.createElement("div");
        lgd.className = "st";
        lgd.textContent = (lg.hms || "") + " " + (lg.text || "");
        row.appendChild(lgd);
      }
      const ops = document.createElement("div");
      ops.className = "ops";
      const act = async (a, arg) => {
        const res = await api("/api/team/workflow", { wid: w.id, act: a, arg: arg || "" });
        (res && res.ok) ? toast("已执行" + (res.assigned ? "：派给 " + res.assigned : ""), true)
                        : toast((res && res.error) || "操作失败");
        renderTeam();
      };
      const addBtn = (label, a) => {
        const b = document.createElement("button");
        b.textContent = label;
        b.onclick = () => {
          if (a === "delete" && !confirm("删除这条工作流？")) return;
          act(a, "");
        };
        ops.appendChild(b);
      };
      if (w.status === "draft") addBtn("▶ 启动", "start");
      if (w.status === "paused" || w.status === "stuck") addBtn("▶ 继续", "start");
      if (w.status === "running") { addBtn("⏸ 暂停", "pause"); addBtn("✔ 本步完成", "force_done"); }
      if (w.status === "running" || w.status === "stuck") addBtn("🔁 重派本步", "redispatch");
      addBtn("🗑", "delete");
      row.appendChild(ops);
      box.appendChild(row);
    }
    // 一键建模板链（实现→审查→部署）；要自定义步骤去桌面团队面板
    const nw = document.createElement("div");
    nw.className = "ops";
    const wfInp = document.createElement("input");
    wfInp.className = "asg";
    wfInp.placeholder = "⛓ 新任务链名（模板：实现→审查→部署）";
    nw.appendChild(wfInp);
    const wfBtn = document.createElement("button");
    wfBtn.textContent = "建链";
    wfBtn.onclick = async () => {
      const name = (wfInp.value || "").trim();
      if (!name) { toast("先给链起个名"); return; }
      const steps = [
        { title: "实现", detail: "按需求完成代码改动，跑通相关测试。", executor: "auto" },
        { title: "审查", detail: "只审不改：逐条指出正确性/边界/回归风险，结论写明通过或打回。", executor: "role:review" },
        { title: "部署", detail: "把已审的改动部署/热拷到运行副本并重启验证，部署前写黑板预告。", executor: "auto" },
      ];
      const c = await api("/api/team/workflow_create",
        { name: name, root: p.root, steps: steps, timeout_min: 45 });
      if (!c || !c.ok) { toast((c && c.error) || "创建失败"); return; }
      const s = await api("/api/team/workflow", { wid: c.id, act: "start", arg: "" });
      (s && s.ok) ? toast("链已启动，第1步派给 " + (s.assigned || "执行人"), true)
                  : toast("链已建，第1步没派出去：" + ((s && s.error) || "稍后点「继续」"));
      renderTeam();
    };
    nw.appendChild(wfBtn);
    box.appendChild(nw);
    for (const a of p.agents) box.appendChild(teamAgentRow(a));
    // 孤儿 WIP：写完没提交、人已经不在了。这种改动没人会来提起它，
    // 手机上也得能一眼看见（08-24 那批在生产上跑了三天没人认）
    const wsum = p.wip_orphans || {};
    if (wsum.count) {
      const al = document.createElement("div");
      al.className = "pmeta";
      al.style.whiteSpace = "normal";
      al.style.color = "#e5484d";
      al.textContent = "⚠ " + wsum.text;
      box.appendChild(al);
      for (const w of (p.wip || []).filter(x => x.orphan).slice(0, 8)) {
        const row = document.createElement("div");
        row.className = "pmeta";
        row.style.whiteSpace = "normal";
        // 一队横跨几个仓时，不带仓名的文件名是在撒谎
        row.textContent = "　" + (w.untracked ? "＋ " : "")
          + (w.ws ? w.ws + " / " : "") + w.file
          + "　" + (w.tab || (w.owner ? w.owner.slice(0, 8) : "—"))
          + "　" + (w.state === "offline" ? "已离线" : "会话已不在");
        box.appendChild(row);
      }
    }
    // 队内传话按项目卡片展示；同一工作区下的其他项目不能混进来。
    const relays = (p.relays || []).slice().reverse();
    if (relays.length) {
      const h = document.createElement("div");
      h.className = "ph";
      h.textContent = "📨 队内传话（最近 " + Math.min(relays.length, 10) + " 条）";
      box.appendChild(h);
      for (const x of relays.slice(0, 10)) {
        const row = document.createElement("div");
        row.className = "pmeta";
        row.style.whiteSpace = "normal";
        if (!x.ok) row.style.color = "#e5484d";
        const toTxt = (x.to_labels && x.to_labels.length)
          ? x.to_labels.join("、") : ("「" + (x.to || "?") + "」");
        row.textContent = (x.hms || "") + " " + (x.from_label || x.from8)
          + (x.kind === "广播" ? " 📢→ " : " → ") + toTxt + "："
          + (x.ok ? (x.text || "") : ((x.note || "失败") + (x.text ? " · " + x.text : "")));
        box.appendChild(row);
      }
    }
    body.appendChild(box);
  }
  if (histProjects.length) {
    const box = document.createElement("div");
    box.className = "tp";
    const h = document.createElement("div");
    h.className = "ph";
    h.textContent = "历史项目（无人在跑 · " + histProjects.length + "）";
    box.appendChild(h);
    const note = document.createElement("div");
    note.className = "pmeta";
    const shown = histProjects.slice(0, 8);
    note.textContent = shown.map(p => p.name).join("、")
      + (histProjects.length > 8
        ? " 等 " + histProjects.length + " 个（其余看会话栏已结束）"
        : "");
    box.appendChild(note);
    body.appendChild(box);
  }
  if (legacyRelays.length) {
    const box = document.createElement("div");
    box.className = "tp";
    const h = document.createElement("div");
    h.className = "ph";
    h.textContent = "升级前未分项目历史（" + legacyRelays.length + " 条）";
    box.appendChild(h);
    const note = document.createElement("div");
    note.className = "pmeta";
    note.textContent = "这些旧传话没有 TeamScope，无法可靠归入任何命名项目。";
    box.appendChild(note);
    for (const x of legacyRelays.slice(0, 20)) {
      const row = document.createElement("div");
      row.className = "pmeta";
      row.style.whiteSpace = "normal";
      if (!x.ok) row.style.color = "#e5484d";
      const toTxt = (x.to_labels && x.to_labels.length) ? x.to_labels.join("、") : (x.to || "?");
      row.textContent = (x.hms || "") + " " + (x.from_label || x.from8 || "?")
        + " → " + toTxt + "：" + (x.text || x.note || "");
      box.appendChild(row);
    }
    body.appendChild(box);
  }
}

/* 批量派单：一屏把几个挂掉的对话各配一个在线 agent，一次派完 */
function renderDispatch() {
  const body = $("teamBody");
  body.innerHTML = "";
  const dead = state.sessions.filter(s => !s.connected);
  const live = state.sessions.filter(s => s.connected);
  const title = document.createElement("div");
  title.className = "pmeta";
  title.textContent = "左边是掉线/挂掉的对话，给每个挑一个接手方（选「自动」由控制台挑最闲的那个；几个对话选同一个人时会合成一张单只发一条）";
  body.appendChild(title);
  if (!dead.length) { body.appendChild(document.createTextNode("（没有掉线的对话）")); return; }
  const picks = {};
  for (const d of dead) {
    const row = document.createElement("div");
    row.className = "tag";
    const nm = document.createElement("span");
    nm.className = "nm";
    nm.textContent = d.name + (d.death_reason ? "（⚠ " + d.death_reason + "）" : "");
    row.appendChild(nm);
    const sel = document.createElement("select");
    for (const o of [{ id: "", label: "— 不派 —" }, { id: "auto", label: "自动挑一个" }]
      .concat(live.map(x => ({ id: x.id, label: (x.pending ? "🟢 " : "⚪ ") + x.name })))) {
      const op = document.createElement("option");
      op.value = o.id; op.textContent = o.label;
      sel.appendChild(op);
    }
    sel.onchange = () => { picks[d.id] = sel.value; };
    row.appendChild(sel);
    body.appendChild(row);
  }
  const go = document.createElement("button");
  go.className = "sact";
  go.textContent = "🤝 按上面的配对一次派完";
  go.onclick = async () => {
    const pairs = Object.keys(picks).filter(k => picks[k]).map(k => ({ sid: k, target: picks[k] }));
    if (!pairs.length) { toast("还没选接手方"); return; }
    let r;
    try { r = await api("/api/takeover_batch", { pairs: pairs, who: nick }); }
    catch (e) { toast("派单失败：" + e.message); return; }
    const done = (r && r.done) || [], failed = (r && r.failed) || [];
    toast("派出 " + done.length + " 个" + (failed.length ? "，失败 " + failed.length : ""), !!done.length);
    if (failed.length) console.log("派单失败：", failed);
    renderTeam();
  };
  body.appendChild(go);
}

/* 手机上没有右键：⋯ 按钮 / tab 长按都开这个动作面板。
   最要紧的一条是「让别人接手」——控制台上要复制提示词再粘到 Cursor 窗口，
   手机上没处粘，所以这里直接把接手提示词投给另一个活着的 agent。 */
let sheetSid = null;

function closeSheet() { $("sheet").style.display = "none"; sheetSid = null; }

function sheetButton(label, hint, fn) {
  const b = document.createElement("button");
  b.className = "sact";
  b.appendChild(document.createTextNode(label));
  if (hint) {
    const d = document.createElement("div");
    d.className = "sdim";
    d.textContent = hint;
    b.appendChild(d);
  }
  b.onclick = fn;
  return b;
}

function openSheet(sid) {
  const s = state.sessions.find(x => x.id === sid);
  if (!s) return;
  sheetSid = sid;
  const st = dotStateOf(s);
  $("sheetTitle").textContent = (s.wtag ? s.wtag + " " : "") + s.name;
  $("sheetSub").textContent = dotTitleOf(s, st)
    + (s.agent_activity ? "｜" + s.agent_activity : "")
    + (s.death_reason ? "｜⚠ 挂了：" + s.death_reason : "")
    + "\n" + (s.cwd || "");
  const box = $("sheetActs");
  box.innerHTML = "";
  if (sid !== activeId) {
    box.appendChild(sheetButton("💬 打开这个对话", "", () => { closeSheet(); selectSession(sid); }));
  }
  if (!PATH_SID) {
    box.appendChild(sheetButton("🤝 让别的 agent 接手", "把接手提示词直接发给一个在线的 agent",
      () => pickTakeoverTarget(sid)));
    box.appendChild(sheetButton("📋 复制接手提示词", "自己粘到 Cursor 窗口也行", async () => {
      let r;
      try { r = await api("/api/takeover_prompt?sid=" + encodeURIComponent(sid)); }
      catch (e) { toast("取提示词失败：" + e.message); return; }
      if (!r || !r.ok) { toast((r && r.error) || "取提示词失败"); return; }
      await copyOrShow("接手提示词", r.prompt);
    }));
  }
  if (s.conv_key) {
    box.appendChild(sheetButton("🆔 复制对话ID", s.conv_key, async () => {
      await copyOrShow("对话ID", s.conv_key);
    }));
  }
  if (s.cwd) {
    box.appendChild(sheetButton("📁 复制工作目录", s.cwd, async () => {
      await copyOrShow("工作目录", s.cwd);
    }));
  }
  // 单会话直连时侧栏整条收起来了，改昵称只剩这一个入口
  box.appendChild(sheetButton("👤 改昵称", "现在是「" + (nick || "未命名") + "」",
    () => { closeSheet(); askNick(false); }));
