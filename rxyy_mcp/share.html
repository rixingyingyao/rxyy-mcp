<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#101014">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234d8bf5'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='%23fff' font-family='sans-serif'%3E%E6%8C%81%3C/text%3E%3C/svg%3E">
<title>rxyy-mcp · 会话分享</title>
<style>
  :root {
    --bg: #0e0e12; --bg-2: #17171c; --bg-3: #1d1d23; --bg-4: #26262e;
    --border: #2c2c34; --border-2: #3a3a44;
    --text: #e8eaf0; --text-2: #a1a7b5; --text-3: #6f7585;
    --primary: #4d8bf5; --primary-2: #2f6fe0; --primary-soft: #1a2c4d;
    --green: #22c55e; --orange: #f59e0b; --red: #ef4444;
    --side-w: 244px;
    --tap: 44px;                       /* 手指最小可点尺寸 */
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
    --sar: env(safe-area-inset-right, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; height: 100dvh; }
  body {
    background: var(--bg); color: var(--text);
    font: 13px/1.6 "Microsoft YaHei UI", "PingFang SC", "Noto Sans SC", "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: row; overflow: hidden;
    -webkit-text-size-adjust: 100%;
  }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { border: none; background: none; cursor: pointer; }
  ::selection { background: #2f6fe0aa; }

  /* 手机上一滑就选中文字，是因为整页文字都可选：手指落在会话名、选项、快捷词
     这些「不滚动」的地方一划，iOS 没得滚就退化成拖选，还弹出放大镜。
     所以界面外壳一律不可选，只有真正想复制的地方（消息正文、输入框）留着。 */
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .msg .bubble, #ta, input, textarea {
    -webkit-user-select: text; user-select: text; -webkit-touch-callout: default;
  }

  /* ---------- 左侧会话栏：PC 常驻，手机变抽屉 ---------- */
  #side {
    width: var(--side-w); min-width: var(--side-w); height: 100%;
    background: var(--bg-2); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; z-index: 40;
    padding-top: var(--sat); padding-left: var(--sal); padding-bottom: var(--sab);
  }
  #brand {
    display: flex; align-items: center; gap: 8px; padding: 11px 12px 8px; flex-shrink: 0;
  }
  #brand .logo {
    width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0;
    background: linear-gradient(135deg, #4d8bf5, #7c5cf0); color: #fff;
    display: grid; place-items: center; font-weight: 800; font-size: 11px;
  }
  #brand .bname { font-weight: 700; font-size: 13px; line-height: 1.25; }
  #brand .bsub { font-size: 10.5px; color: var(--text-3); }
  #sideClose { display: none; margin-left: auto; width: 34px; height: 34px; border-radius: 9px; color: var(--text-3); font-size: 17px; }

  #filterWrap { flex-shrink: 0; padding: 0 10px 8px; }
  #qFilter {
    width: 100%; background: var(--bg-3); border: 1px solid var(--border);
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; outline: none;
  }
  #qFilter:focus { border-color: var(--primary); }
  #qFilter::placeholder { color: var(--text-3); }

  #tabs {
    flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 2px;
    overflow-y: auto; overscroll-behavior: contain; padding: 0 8px 10px;
    scrollbar-width: thin; -webkit-overflow-scrolling: touch;
  }
  #tabs::-webkit-scrollbar { width: 5px; }
  #tabs::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 3px; }
  .tab {
    display: flex; align-items: center; gap: 8px; width: 100%; flex-shrink: 0;
    min-height: 38px; padding: 7px 9px; border-radius: 9px;
    border: 1px solid transparent; background: transparent;
    color: var(--text-2); text-align: left; cursor: pointer;
    position: relative; touch-action: manipulation;
  }
  .tab:hover { background: #ffffff0a; }
  .tab.active { background: var(--primary-soft); color: var(--text); border-color: #2f6fe066; font-weight: 600; }
  .tab .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .tab .tname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; }
  .tab .wtag { color: #eab308; font-weight: 700; font-size: 10.5px; flex-shrink: 0; }
  .tab .badge {
    background: var(--orange); color: #1a1200; font-size: 10px; font-weight: 800;
    border-radius: 9px; padding: 0 5px; min-width: 17px; text-align: center; flex-shrink: 0;
  }
  .tab .more {
    flex-shrink: 0; width: 24px; height: 24px; border-radius: 6px;
    color: var(--text-3); font-size: 15px; line-height: 1; opacity: 0;
  }
  .tab:hover .more, .tab.active .more { opacity: 1; }
  .tab .more:hover { background: var(--bg-4); color: var(--text); }

  .tgroup {
    display: flex; align-items: center; gap: 6px; flex-shrink: 0;
    margin-top: 7px; padding: 6px 9px 3px; width: 100%;
    font-size: 11px; color: var(--text-3); text-align: left;
    border-top: 1px dashed var(--border);
  }
  .tgroup:hover { color: var(--text-2); }
  .tgroup .arr { font-size: 9px; width: 9px; }
  .tgroup.resume { color: #d97706; border-top-color: #d9770655; }

  .dot.busy { background: #eab308; animation: pulse 1.1s infinite; }
  .dot.idle { background: #6b7280; }
  .dot.ready { background: var(--green); box-shadow: 0 0 6px 1px #22c55eaa; }
  .dot.dead { background: #1b1b22; border: 1px solid #52525b; }
  .dot.recon { background: #f97316; animation: pulse 0.7s infinite; }
  .dot.live { background: var(--primary); box-shadow: 0 0 5px 1px #4d8bf580; }
  .dot.work { background: #a855f7; animation: pulse 1s infinite; }
  .dot.busystale { background: #a16207; }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1);} 50% { opacity: .4; transform: scale(.8);} }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none !important; } }

  #sideFoot {
    flex-shrink: 0; border-top: 1px solid var(--border); padding: 8px 10px;
    display: flex; flex-direction: column; gap: 7px;
  }
  #legend { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 8px; font-size: 10px; color: var(--text-3); }
  #legend .lg { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
  #legend .dot { width: 8px; height: 8px; border-radius: 50%; animation: none !important; box-shadow: none !important; }
  #nickBtn {
    display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-2);
    padding: 5px 7px; border-radius: 8px; background: var(--bg-3); border: 1px solid var(--border);
  }
  #nickBtn:hover { color: var(--text); border-color: var(--border-2); }

  #scrim { position: fixed; inset: 0; z-index: 35; background: #000000a8; display: none; }

  /* 侧栏与正文之间那条线要能拖。会话名普遍很长（「待命·smart_cloud_broadcasting_live_api」
     这种），244px 一律截断；但拉宽了正文又窄。宽度存本地，下次打开还是你调好的那档。
     手柄本身 7px 宽（手指也够得着），压在边界上不占布局宽度。 */
  #sideGrip {
    position: relative; z-index: 41; flex: 0 0 auto;
    width: 7px; margin: 0 -3px 0 -4px;
    cursor: col-resize; touch-action: none;
  }
  #sideGrip::after {
    content: ""; position: absolute; top: 0; bottom: 0; left: 3px; width: 1px;
    background: transparent; transition: background .12s;
  }
  #sideGrip:hover::after, body.resizing #sideGrip::after { background: var(--primary); }
  body.resizing { cursor: col-resize; user-select: none; }
  body.resizing #side, body.resizing #content { pointer-events: none; }

  /* ---------- 右侧内容列 ---------- */
  #content {
    flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column;
    background: var(--bg-3);
    padding-right: var(--sar);
  }
  #topbar {
    display: flex; align-items: center; gap: 8px; flex-shrink: 0;
    padding: 7px 10px; padding-top: calc(7px + var(--sat));
    background: var(--bg-2); border-bottom: 1px solid var(--border);
  }
  .iconbtn {
    width: 36px; height: 36px; flex-shrink: 0; border-radius: 9px;
    display: grid; place-items: center; font-size: 16px; color: var(--text-2);
    background: var(--bg-3); border: 1px solid var(--border);
  }
  .iconbtn:hover { color: var(--text); border-color: var(--border-2); }
  #menuBtn { display: none; position: relative; }
  #menuBtn .ndot {
    position: absolute; top: 4px; right: 4px; width: 8px; height: 8px; border-radius: 50%;
    background: var(--orange); display: none;
  }
  #menuBtn.has-unread .ndot { display: block; }
  #curBox { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
  #curTitle { display: flex; align-items: center; gap: 6px; min-width: 0; }
  #curTitle .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  #curTitle .nm { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #curSub { font-size: 10.5px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  #offlineBar {
    display: none; flex-shrink: 0; padding: 5px 12px; font-size: 11.5px;
    background: #3f1416; color: #fca5a5; border-bottom: 1px solid #7f1d1d; text-align: center;
  }
  body.offline #offlineBar { display: block; }

  #main { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #msgs { flex: 1; min-height: 0; position: relative; }
  .mlist {
    position: absolute; inset: 0; display: none; flex-direction: column; gap: 10px;
    overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
    padding: 12px 14px calc(12px + var(--sab)); scrollbar-width: thin;
  }
  .mlist.on { display: flex; }
  .mlist::-webkit-scrollbar { width: 6px; }
  .mlist::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 3px; }
  #jumpBtn {
    position: absolute; right: 16px; bottom: 14px; z-index: 5; display: none;
    background: var(--primary); color: #fff; font-size: 12px; font-weight: 600;
    border-radius: 18px; padding: 7px 14px; box-shadow: 0 4px 16px #0009;
  }
  #jumpBtn.on { display: block; }

  /* 宽屏上别把一行拉到 1400px：读长回复时眼睛要横着扫一整屏 */
  .msg { display: flex; flex-direction: column; max-width: min(90%, 900px); }
  .msg .meta { font-size: 11px; color: var(--text-3); margin-bottom: 3px; }
  .msg .bubble { padding: 9px 12px; border-radius: 12px; word-break: break-word; user-select: text; }
  .msg.ai { align-self: flex-start; }
  .msg.ai .bubble { background: var(--bg-2); border: 1px solid var(--border); border-top-left-radius: 4px; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.user .bubble { background: #1d3a6e; border: 1px solid #2b528f; border-top-right-radius: 4px; }
  .msg.user.remote .bubble { background: #14532d; border-color: #196b3a; }
  .msg.sys { align-self: center; max-width: 100%; }
  .msg.sys .bubble {
    background: transparent; border: none; color: var(--text-3);
    font-size: 11px; padding: 0 8px; text-align: center;
  }
  .bubble pre.plain { white-space: pre-wrap; font-family: inherit; }
  .bubble > :first-child { margin-top: 0; }
  .bubble > :last-child { margin-bottom: 0; }
  .bubble h1 { font-size: 16px; margin: 10px 0 5px; }
  .bubble h2 { font-size: 15px; margin: 9px 0 4px; padding-bottom: 3px; border-bottom: 1px solid var(--border); }
  .bubble h3 { font-size: 14px; margin: 8px 0 4px; }
  .bubble h4,.bubble h5,.bubble h6 { font-size: 13px; margin: 6px 0 3px; }
  .bubble p { margin: 4px 0; }
  .bubble ul,.bubble ol { padding-left: 18px; margin: 4px 0; }
  .bubble li { margin: 2px 0; }
  .bubble li.task { list-style: none; margin-left: -15px; }
  .bubble li.task input { vertical-align: -2px; margin-right: 4px; accent-color: var(--primary); }
  .bubble hr { border: none; border-top: 1px solid var(--border); margin: 9px 0; }
  .bubble del { color: var(--text-3); }
  .bubble code {
    background: #00000055; padding: 1px 5px; border-radius: 4px;
    font-family: "Cascadia Mono", Consolas, monospace; font-size: 12px; color: #93c5fd;
  }
  .bubble pre { background: #0d1117; border: 1px solid var(--border); border-radius: 8px; margin: 6px 0; position: relative; }
  .bubble pre code { display: block; padding: 8px 10px; overflow-x: auto; color: #d1d5db; background: transparent; scrollbar-width: thin; -webkit-overflow-scrolling: touch; }
  .bubble .codecite {
    font: 11px/1.5 "Cascadia Mono", Consolas, monospace; color: var(--text-2);
    background: var(--bg-4); border: 1px solid var(--border); border-bottom: none;
    border-radius: 8px 8px 0 0; padding: 4px 10px; margin-top: 6px; overflow-wrap: anywhere;
  }
  .bubble .codecite + pre { border-top-left-radius: 0; border-top-right-radius: 0; margin-top: 0; }
  .tblwrap { overflow-x: auto; max-width: 100%; margin: 6px 0; scrollbar-width: thin; -webkit-overflow-scrolling: touch; }
  .bubble table { border-collapse: collapse; font-size: 12px; }
  .bubble th,.bubble td { border: 1px solid var(--border); padding: 4px 9px; }
  .bubble th { background: var(--bg-4); font-weight: 700; text-align: left; }
  .bubble tr:nth-child(2n) td { background: #ffffff08; }
  .bubble blockquote { border-left: 3px solid var(--primary); padding: 2px 4px 2px 8px; color: var(--text-2); margin: 4px 0; background: #ffffff0a; border-radius: 0 6px 6px 0; }
  .bubble a { color: #7fb0ff; overflow-wrap: anywhere; }
  .bubble img { max-width: min(100%, 380px); max-height: 300px; border-radius: 8px; border: 1px solid var(--border); cursor: zoom-in; display: block; margin: 6px 0; object-fit: contain; background: #00000040; }
  .bubble details { margin: 6px 0; border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; background: var(--bg-4); }
  .bubble summary { cursor: pointer; font-weight: 700; }
  .code-copy {
    position: absolute; top: 5px; right: 5px; font-size: 10px; background: #0b1120cc;
    color: var(--text-2); border: 1px solid var(--border); border-radius: 5px; padding: 2px 8px;
  }
  /* highlight.js 深色令牌配色（github-dark 系；无 hljs 时退化单色） */
  .hljs-comment,.hljs-quote { color: #8b949e; font-style: italic; }
  .hljs-keyword,.hljs-selector-tag,.hljs-subst { color: #ff7b72; }
  .hljs-number,.hljs-literal,.hljs-variable,.hljs-template-variable,.hljs-tag .hljs-attr,.hljs-symbol,.hljs-bullet,.hljs-meta,.hljs-link { color: #79c0ff; }
  .hljs-string,.hljs-doctag,.hljs-regexp,.hljs-addition { color: #a5d6ff; }
  .hljs-title,.hljs-section,.hljs-selector-id,.hljs-title.function_ { color: #d2a8ff; }
  .hljs-type,.hljs-built_in,.hljs-builtin-name,.hljs-title.class_ { color: #ffa657; }
  .hljs-tag,.hljs-name,.hljs-attribute { color: #7ee787; }
  .hljs-emphasis { font-style: italic; }
  .hljs-strong { font-weight: bold; }
  .hljs-addition { background: #1c3325; }
  .hljs-deletion { color: #ffdcd7; background: #3a1618; }

  .opt-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .opt-chip { font-size: 11px; color: var(--text-2); border: 1px dashed var(--border-2); border-radius: 6px; padding: 1px 7px; }
  .sel-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; justify-content: flex-end; }
  .sel-tag { font-size: 11px; background: #14532d; color: #86efac; border-radius: 6px; padding: 1px 7px; }
  .img-note { font-size: 11px; color: #fbbf24; margin-top: 3px; }
  .file-note { font-size: 11px; color: #93c5fd; margin-top: 3px; word-break: break-all; }
  .bubble.queued { border-style: dashed !important; border-color: var(--orange) !important; opacity: .92; }
  .bubble.cancelled { opacity: .5; text-decoration: line-through; }
  .queue-note { display: flex; align-items: center; gap: 8px; justify-content: flex-end; font-size: 11px; color: var(--orange); margin-top: 3px; }
  .queue-note.cancelled { color: var(--text-3); }
  .queue-cancel { cursor: pointer; color: var(--text-2); border: 1px solid var(--border); border-radius: 5px; padding: 2px 9px; }
  .queue-cancel:hover { color: var(--red); border-color: var(--red); }
  .img-thumbs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .msg.user .img-thumbs { justify-content: flex-end; }
  .img-thumbs img { max-width: 150px; max-height: 105px; border-radius: 8px; border: 1px solid var(--border); cursor: zoom-in; object-fit: cover; background: #00000040; }

  #typing {
    flex-shrink: 0; display: flex; align-items: center; gap: 5px;
    padding: 6px 14px; border-top: 1px dashed var(--border);
    font-size: 11px; color: var(--text-2);
  }
  #typing .avatar {
    width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    display: grid; place-items: center; font-size: 9px; color: #fff; font-weight: 700; margin-right: 3px;
  }
  #typingLabel { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tdot { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); flex-shrink: 0; animation: tbounce 1.2s ease-in-out infinite; }
  .tdot:nth-child(3) { animation-delay: .15s; }
  .tdot:nth-child(4) { animation-delay: .3s; }
  @keyframes tbounce { 0%,60%,100% { transform: translateY(0); opacity: .45; } 30% { transform: translateY(-4px); opacity: 1; } }

  /* 实时时间线：agent 在 Cursor 里的每一步（与控制台 #liveTurn 同源，手机版暗色） */
  #liveTurn { flex-shrink: 0; display: flex; flex-direction: column; min-height: 0; border-top: 1px dashed var(--border); font-size: 12px; color: var(--text-2); background: var(--bg-2); }
  #liveTurn .lt-head { display: flex; align-items: center; gap: 7px; padding: 7px 12px; min-height: var(--tap, 40px); cursor: pointer; user-select: none; flex-shrink: 0; }
  .lt-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); flex-shrink: 0; }
  .lt-dot.live { background: var(--primary); animation: ltpulse 1.4s ease-in-out infinite; }
  @keyframes ltpulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  .lt-title { font-weight: 600; color: var(--text); flex-shrink: 0; }
  .lt-meta { color: var(--text-3); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }
  .lt-toggle { color: var(--text-3); font-size: 11px; flex-shrink: 0; }
  /* 上下文用量牌：Cursor 自己记在 composerData 上的精确值（不是按消息条数猜） */
  .lt-ctx { flex-shrink: 0; font-size: 10px; padding: 1px 6px; border-radius: 999px;
            border: 1px solid var(--border); color: var(--text-3); }
  .lt-ctx.warn { color: #fbbf24; border-color: #78551a; }
  .lt-ctx.high { color: #fcd34d; border-color: #b45309; background: #3b2a08; font-weight: 600; }
  .lt-ctx.critical { color: #fff; border-color: var(--red); background: var(--red); font-weight: 600; }
  #liveTurn .lt-body { overflow-y: auto; max-height: 34vh; padding: 0 8px 6px 12px; display: flex; flex-direction: column; gap: 2px; }
  .lt-omitted { color: var(--text-3); font-size: 11px; padding: 2px 0 4px 22px; }
  .lt-step { display: flex; align-items: flex-start; gap: 6px; padding: 4px 6px; border-radius: 6px; line-height: 1.5; }
  .lt-step.clickable { cursor: pointer; }
  .lt-ico { width: 16px; text-align: center; flex-shrink: 0; opacity: .85; }
  .lt-lbl { flex-shrink: 0; color: var(--text-2); }
  .lt-step.tool .lt-lbl { font-weight: 600; }
  .lt-sum { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: Consolas, Menlo, monospace; font-size: 11px; color: var(--text); }
  .lt-step.thinking .lt-sum { font-family: inherit; font-style: italic; color: var(--text-3); }
  .lt-st { flex-shrink: 0; font-size: 11px; }
  .lt-st.done { color: var(--green); }
  .lt-st.running { color: var(--primary); animation: ltpulse 1.2s ease-in-out infinite; }
  .lt-st.error { color: var(--red); }
  .lt-st.cancelled { color: var(--text-3); }
  .lt-ms { color: var(--text-3); font-size: 10.5px; flex-shrink: 0; }
  .lt-detail { margin: 0 6px 4px 26px; padding: 6px 8px; border-radius: 6px; background: var(--bg-3); border: 1px solid var(--border); white-space: pre-wrap; word-break: break-all; font-family: Consolas, Menlo, monospace; font-size: 11px; color: var(--text-2); max-height: 200px; overflow-y: auto; }
  .lt-step.thinking + .lt-detail { font-family: inherit; font-style: italic; color: var(--text-3); }
  .lt-detail.diff { white-space: pre; overflow-x: auto; }
  .lt-detail .dl-add { color: #86efac; background: #14532d55; }
  .lt-detail .dl-del { color: #fca5a5; background: #7f1d1d55; }
  .lt-detail .dl-hunk { color: var(--text-3); }
  .lt-step.text .lt-text { flex: 1; min-width: 0; white-space: pre-wrap; word-break: break-word; color: var(--text); }
  .lt-step.error .lt-sum { color: var(--red); white-space: normal; }
  .tab .schip { font-size: 10px; color: var(--text-2); background: var(--bg-3); border: 1px solid var(--border-2); border-radius: 7px; padding: 0 5px; flex-shrink: 0; max-width: 96px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tab .schip.running { color: var(--primary); border-color: var(--primary-soft); background: var(--primary-soft); }

  #empty {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 10px; color: var(--text-3); padding: 20px; text-align: center;
  }
  #empty .big { font-size: 15px; color: var(--text-2); }

  #inputArea {
    flex-shrink: 0; border-top: 1px solid var(--border); background: var(--bg-2);
    padding: 8px 10px calc(8px + var(--sab));
    display: flex; flex-direction: column; gap: 7px;
    /* 硬上限：选项 + 快捷词 + 输入框 + 按钮行叠起来能吃掉三分之二个手机屏，
       回复就被压成顶上四行。给消息区留住 44%，超出的部分在输入区内部滚。 */
    max-height: 56%; overflow-y: auto; overscroll-behavior: contain;
  }
  /* 这个上限是防页面自作主张，不是防人：手动拖过高度就以人定的为准
     （拖拽自己有「消息区至少 140px」兜底，见 taMaxHeight） */
  body.ta-pinned #inputArea { max-height: none; }
  /* 输入区自己会滚了，发送键就得钉在底下，不然要先滚一段才够得着 */
  #btnRow {
    position: sticky; bottom: calc(-8px - var(--sab)); z-index: 3;
    background: var(--bg-2); padding-bottom: 2px;
  }
  /* 输入区顶边可拖：输入框本来就随内容长高，但封顶 34vh，在电脑上写长回复还是憋。
     拖过就按你定的高度来，双击回到「跟着内容走」。触屏上没有悬停也不好瞄，隐掉。 */
  #taGrip {
    flex: 0 0 auto; height: 9px; margin: -12px -10px -3px;
    position: relative; z-index: 2; cursor: row-resize; touch-action: none;
  }
  #taGrip::after {
    content: ""; position: absolute; left: 0; right: 0; top: 4px; height: 1px;
    background: transparent; transition: background .12s;
  }
  #taGrip:hover::after, body.resizing-v #taGrip::after { background: var(--primary); }
  body.resizing-v { cursor: row-resize; user-select: none; }
  body.resizing-v .mlist { pointer-events: none; }
  #options { display: flex; flex-direction: column; gap: 5px; max-height: 34vh; overflow-y: auto; overscroll-behavior: contain; }
  .optrow {
    display: flex; align-items: center; gap: 9px; min-height: var(--tap);
    background: var(--bg-3); border: 1px solid var(--border);
    border-radius: 9px; padding: 8px 11px; cursor: pointer; touch-action: manipulation;
  }
  .optrow.checked { border-color: var(--primary); background: #1c2d4a; }
  .optrow .box {
    width: 17px; height: 17px; border: 1.5px solid var(--text-3); border-radius: 5px;
    flex-shrink: 0; display: grid; place-items: center; font-size: 11px; color: #fff;
  }
  .optrow.checked .box { background: var(--primary); border-color: var(--primary); }
  /* 决策卡片（zhi 的 card 参数）：气泡里的静态呈现 .dcard-*，输入区里可点的 .dc-* */
  .dcard { margin-top: 8px; border: 1px solid var(--border); border-radius: 9px; padding: 8px 10px; background: var(--bg-2); }
  .dcard-title { font-weight: 600; margin-bottom: 4px; }
  .dcard-q { margin: 6px 0 2px; }
  .dcard-prompt { font-weight: 500; }
  .dcard-opt { margin: 2px 0 2px 12px; font-size: 13px; }
  .dcard-detail { color: var(--text-2); font-size: 12px; white-space: pre-wrap; margin-left: 2px; }
  .dcard-rec, .dcard-multi { font-size: 10px; color: var(--primary); border: 1px solid var(--primary); border-radius: 4px; padding: 0 4px; margin-left: 4px; }
  .dcard-free { color: var(--text-3); }
  #options.has-card { max-height: 52vh; }
  .dc-card { display: flex; flex-direction: column; gap: 7px; padding: 2px; }
  .dc-title { font-weight: 600; font-size: 13.5px; }
  .dc-q { border-left: 2px solid var(--border-2); padding-left: 8px; display: flex; flex-direction: column; gap: 5px; }
  .dc-prompt { font-size: 13.5px; font-weight: 500; }
  .dc-opt { align-items: flex-start; }
  .dc-opt .dc-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .dc-opt .dc-detail { font-size: 12.5px; color: var(--text-2); white-space: pre-wrap; word-break: break-word; }
  .dc-opt.rec .dc-label::after { content: "推荐"; font-size: 10px; color: var(--primary); border: 1px solid var(--primary); border-radius: 4px; padding: 0 4px; margin-left: 6px; }
  .dc-free { width: 100%; box-sizing: border-box; font-size: 14px; padding: 9px 10px; min-height: var(--tap); border: 1px solid var(--border); border-radius: 8px; background: var(--bg-3); color: var(--text); }
  /* 选项一多就要滚，提交按钮钉在滚动盒底部，不必翻到最后才找得到 */
  .dc-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; position: sticky; bottom: 0; background: var(--bg-2); padding: 4px 0 2px; }
  .dc-foot button { min-height: var(--tap); padding: 0 14px; border-radius: 9px; background: var(--bg-3); border: 1px solid var(--border); color: var(--text); font-size: 13px; touch-action: manipulation; }
  .dc-foot button.primary { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }
  .dc-foot button:disabled { opacity: .5; }
  .dc-timer { font-size: 12px; color: var(--text-3); }
  #quickBar { display: flex; flex-wrap: wrap; gap: 5px; }
  #quickBar .qp {
    font-size: 11.5px; color: var(--text-2); background: var(--bg-3);
    border: 1px solid var(--border); border-radius: 14px; padding: 5px 12px;
    white-space: nowrap; touch-action: manipulation;
  }
  #quickBar .qp:active { border-color: var(--primary); color: var(--text); }
  #imgPreview, #filePreview { display: flex; flex-wrap: wrap; gap: 6px; }
  #imgPreview:empty, #filePreview:empty, #quickBar:empty, #options:empty { display: none; }
  .imgthumb { position: relative; width: 54px; height: 54px; }
  .imgthumb img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); cursor: zoom-in; }
  .imgthumb .rm {
    position: absolute; top: -7px; right: -7px; width: 20px; height: 20px;
    background: var(--red); color: #fff; border-radius: 50%; text-align: center;
    line-height: 19px; font-size: 12px; cursor: pointer;
  }
  .filechip {
    display: flex; align-items: center; gap: 7px; max-width: 240px;
    background: var(--bg-3); border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 9px; font-size: 11.5px; color: var(--text-2);
  }
  .filechip .fname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .filechip .fsize { color: var(--text-3); flex-shrink: 0; }
  .filechip .rm { color: var(--text-3); cursor: pointer; flex-shrink: 0; padding: 0 4px; font-size: 14px; }
  .filechip .rm:hover { color: var(--red); }
  #dropHint {
    position: fixed; inset: 0; z-index: 60; display: none;
    background: #0b1120dd; border: 3px dashed var(--primary);
    align-items: center; justify-content: center;
    font-size: 17px; color: #93c5fd; pointer-events: none;
  }
  #ta {
    width: 100%; resize: none; background: var(--bg-3);
    border: 1px solid var(--border); border-radius: 10px;
    /* 不写 max-height：上限统一由 autoGrow 现算（拖过的按你定的来，没拖过按 34vh），
       写在这儿会把拖拽硬顶在 34vh 上，拉不动 */
    padding: 9px 11px; min-height: 56px; outline: none;
  }
  #ta:focus { border-color: var(--primary); }
  #ta:disabled { opacity: .45; }
  #btnRow { display: flex; align-items: center; gap: 7px; }
  #status { flex: 1; min-width: 0; font-size: 11px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #btnRow button {
    border-radius: 9px; padding: 0 14px; height: 38px; font-size: 12.5px;
    background: var(--bg-4); border: 1px solid var(--border); color: var(--text-2);
    flex-shrink: 0; touch-action: manipulation;
  }
  #btnRow button:disabled { opacity: .4; cursor: not-allowed; }
  #btnSend { background: var(--primary) !important; border-color: var(--primary) !important; color: #fff !important; font-weight: 600; }
  #btnSend:hover:not(:disabled) { background: var(--primary-2) !important; }
  #btnMic.rec { background: #7f1d1d !important; border-color: #ef4444 !important; color: #fff !important; animation: pulse 1.1s infinite; }

  #toast {
    position: fixed; top: calc(12px + var(--sat)); left: 50%; transform: translateX(-50%);
    background: #7f1d1d; color: #fecaca; border: 1px solid #b91c1c;
    padding: 7px 15px; border-radius: 9px; font-size: 12px; max-width: 90vw;
    opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 99;
  }
  #toast.show { opacity: 1; }
  #toast.ok { background: #14532d; color: #bbf7d0; border-color: #16a34a; }

  /* ---------- 弹层 ---------- */
  #nickModal, #teamModal {
    position: fixed; inset: 0; z-index: 50; background: #000000b0;
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .mbox {
    width: min(340px, 92vw); background: var(--bg-2);
    border: 1px solid var(--border); border-radius: 14px; padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .tmbox { width: min(520px, 94vw); }
  .mtitle { font-size: 14px; font-weight: 700; }
  .mbox input {
    background: var(--bg-3); border: 1px solid var(--border); border-radius: 9px;
    padding: 9px 11px; outline: none;
  }
  .mbox input:focus { border-color: var(--primary); }
  .mbtns { display: flex; justify-content: flex-end; gap: 8px; }
  .mbtns button { border-radius: 9px; padding: 0 16px; height: 38px; font-size: 12.5px; background: var(--bg-4); border: 1px solid var(--border); color: var(--text-2); }
  .mbtns .primary { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }
  #teamBody { display: flex; flex-direction: column; gap: 10px; max-height: 66vh; overflow-y: auto; overscroll-behavior: contain; }
  .tp { border: 1px solid var(--border); border-radius: 10px; padding: 9px; background: var(--bg-3); }
  .tp .ph { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; }
  .tp .pmeta { font-size: 10.5px; color: var(--text-3); margin-top: 2px; word-break: break-all; }
  .tp .board { font-size: 11px; color: #fbbf24; margin-top: 5px; white-space: pre-wrap; }
  .tag {
    display: flex; align-items: center; gap: 6px; margin-top: 7px; padding: 7px 8px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--bg-2); flex-wrap: wrap;
  }
  .tag .nm { font-size: 12px; font-weight: 600; }
  .tag .rb { font-size: 10px; border: 1px solid var(--border); border-radius: 5px; padding: 0 5px; color: var(--text-2); }
  .tag .xb { font-size: 10px; border: 1px solid #d9770699; border-radius: 5px; padding: 0 5px; color: var(--orange); }
  .tag .st { font-size: 10.5px; color: var(--text-3); flex-basis: 100%; }
  .tag .fl { font-size: 10.5px; color: #fbbf24; flex-basis: 100%; word-break: break-all; }
  .tag select, .tag input {
    font-size: 11.5px; padding: 6px 8px; border-radius: 7px;
    background: var(--bg-3); border: 1px solid var(--border); min-height: 32px;
  }
  .tag input.asg { flex: 1; min-width: 110px; }
  .tag .ops { display: flex; gap: 6px; flex-basis: 100%; flex-wrap: wrap; }
  .tag .ops button {
    font-size: 11.5px; padding: 0 11px; height: 34px; border-radius: 7px;
    background: var(--bg-3); color: var(--text-2); border: 1px solid var(--border);
  }

  #sheet {
    position: fixed; inset: 0; z-index: 60; background: #000000b0;
    display: flex; align-items: flex-end; justify-content: center;
  }
  #sheet .sbox {
    width: min(440px, 100vw); background: var(--bg-2); border: 1px solid var(--border);
    border-radius: 16px 16px 0 0; padding: 14px; padding-bottom: calc(14px + var(--sab));
    display: flex; flex-direction: column; gap: 8px; max-height: 84vh; overflow-y: auto;
    overscroll-behavior: contain;
  }
  #sheet .stitle { font-size: 13.5px; font-weight: 700; }
  #sheet .ssub { font-size: 11.5px; color: var(--text-3); word-break: break-all; white-space: pre-wrap; }
  .sact {
    width: 100%; text-align: left; padding: 12px; min-height: var(--tap); border-radius: 10px;
    background: var(--bg-3); border: 1px solid var(--border); color: var(--text-2);
  }
  .sact:active { border-color: var(--primary); color: var(--text); }
  .sdim { font-size: 11px; color: var(--text-3); }

  #lightbox {
    position: fixed; inset: 0; z-index: 200; background: #000000e8;
    display: none; align-items: center; justify-content: center; cursor: zoom-out;
  }
  #lightbox img { max-width: 94vw; max-height: 88vh; border-radius: 8px; box-shadow: 0 10px 48px #000; }
  #linkview {
    position: fixed; inset: 0; z-index: 210; background: #000000f0;
    display: none; flex-direction: column;
  }
  #linkviewBar {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    background: var(--bg-2); border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  #linkviewUrl {
    flex: 1; min-width: 0; font-size: 12px; color: var(--text-2);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #linkviewHint { font-size: 11px; color: var(--text-3); padding: 6px 12px 8px; flex-shrink: 0; }
  #linkviewFrame { flex: 1; width: 100%; border: 0; background: #fff; }

  /* ---------- 单会话直连：没有别的会话可选，收掉整条侧栏 ---------- */
  body.solo #side, body.solo #menuBtn, body.solo #scrim, body.solo #sideGrip { display: none !important; }

  /* ---------- 窄屏：侧栏变抽屉，顶栏只留当前会话 ---------- */
  @media (max-width: 899px) {
    #side {
      position: fixed; top: 0; bottom: 0; left: 0; width: min(84vw, 320px);
      transform: translateX(-100%); transition: transform .22s cubic-bezier(.4,0,.2,1);
      box-shadow: 0 0 40px #000a; border-right: 1px solid var(--border);
    }
    body.drawer #side { transform: translateX(0); }
    body.drawer #scrim { display: block; }
    #sideGrip { display: none; }   /* 抽屉模式下没有边界可拖 */
    #sideClose { display: grid; place-items: center; }
    #menuBtn { display: grid; }
    #legend { grid-template-columns: 1fr 1fr 1fr; }
    .tab { min-height: var(--tap); }
    .tab .more { opacity: 1; width: 30px; height: 30px; }
  }
  @media (prefers-reduced-motion: reduce) { #side { transition: none; } }

  @media (max-width: 560px) {
    .msg { max-width: 96%; }
    .bubble img { max-width: 100%; }
    /* 状态文字在顶栏第二行已经有了，这里只留它当撑杆：
       🎤📎 靠左（左手拇指），继续/发送靠右（右手拇指），中间空开不误触 */
    #status { visibility: hidden; order: 2; }
    #btnMic, #btnFile { order: 1; }
    #btnContinue { order: 3; }
    #btnSend { order: 4; }
    #btnRow button { padding: 0 13px; }
    .mlist { padding: 10px 10px calc(10px + var(--sab)); }
    /* 会话之间原本只隔 2px，手指略偏一点就点到隔壁那条 */
    #tabs { gap: 6px; }
    /* ⋯ 在桌面是 hover 才浮现的 24px 小点；手机没有 hover，
       它常驻但太小，想点它点不着、想点会话又容易蹭到。撑大并推开一点 */
    .tab .more { width: 38px; height: 38px; opacity: .75; margin-left: 2px; }
    #sideClose { width: var(--tap); height: var(--tap); }
    #qFilter { min-height: var(--tap); }
    /* 五个选项一排排下来就是 285px。收窄到约四个的高度，剩下的滚 */
    #options { max-height: 26vh; }
    /* 快捷词以前会折成两三排、白吃掉近百像素。改成一排横滑 */
    #quickBar { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
    #quickBar::-webkit-scrollbar { display: none; }
  }
  /* iOS：输入类控件字号 <16px，一聚焦就把整页放大且不缩回来。
     按「触摸设备」判而不是按宽度——平板横屏也照样中招。 */
  @media (pointer: coarse) {
    #ta, #qFilter, .mbox input, .tag input, .tag select { font-size: 16px; }
    #btnRow button { height: var(--tap); }
    #taGrip { display: none; }
  }
  /* 手机横屏/矮屏：选项区和输入框别把消息挤没 */
  @media (max-height: 460px) {
    #options { max-height: 22vh; }
    #ta { min-height: 40px; }   /* 上限同样交给 autoGrow：矮屏由「消息区至少 140px」兜住 */
    #typing { display: none !important; }
    #liveTurn .lt-body { max-height: 22vh; }
  }
</style>
</head>
<body>
  <aside id="side">
    <div id="brand">
      <div class="logo">持久</div>
      <div style="min-width:0">
        <div class="bname">rxyy-mcp</div>
        <div class="bsub">会话分享 · <span id="allCount">0</span> 个对话</div>
      </div>
      <button id="sideClose" class="iconbtn" title="收起">✕</button>
    </div>
    <div id="filterWrap"><input id="qFilter" placeholder="筛选会话名 / 目录" autocomplete="off"></div>
    <div id="tabs"></div>
    <div id="sideFoot">
      <div id="legend">
        <span class="lg"><span class="dot ready"></span>等你</span>
        <span class="lg"><span class="dot busy"></span>处理</span>
        <span class="lg"><span class="dot work"></span>干活</span>
        <span class="lg"><span class="dot recon"></span>重连</span>
        <span class="lg"><span class="dot live"></span>IDE</span>
        <span class="lg"><span class="dot dead"></span>终止</span>
      </div>
      <button id="nickBtn" title="点击修改昵称"></button>
    </div>
  </aside>
  <div id="scrim"></div>
  <div id="sideGrip" title="拖动改会话栏宽度，双击复位"></div>

  <div id="content">
    <div id="topbar">
      <button id="menuBtn" class="iconbtn" title="全部对话" aria-label="全部对话">☰<span class="ndot"></span></button>
      <div id="curBox">
        <div id="curTitle"><span class="dot idle"></span><span class="nm">rxyy-mcp</span></div>
        <div id="curSub">正在连接…</div>
      </div>
      <button id="teamBtn" class="iconbtn" title="团队面板：谁在干什么、谁占着哪些文件、派接手">👥</button>
      <button id="moreBtn" class="iconbtn" title="这个对话能干的事">⋯</button>
    </div>
    <div id="offlineBar">连接断开，正在重试…（链路闪断也会这样，本机会话不一定挂了）</div>

    <div id="main">
      <div id="empty">
        <div class="big" id="emptyBig">暂无进行中的会话</div>
        <div id="emptyHint">发起人的 AI 会话出现后会自动显示在这里</div>
      </div>
      <div id="msgs" style="display:none">
        <button id="jumpBtn">↓ 回到最新</button>
      </div>
      <div id="liveTurn" style="display:none">
        <div class="lt-head" onclick="toggleLiveTurn()">
          <span class="lt-dot" id="ltDot"></span>
          <span class="lt-title" id="ltTitle">Agent 正在回复…</span>
          <span class="lt-meta" id="ltMeta"></span>
          <span class="lt-ctx" id="ltCtx" style="display:none"></span>
          <span class="lt-toggle" id="ltToggle">收起</span>
        </div>
        <div class="lt-body" id="ltBody"></div>
      </div>
      <div id="typing" style="display:none">
        <span class="avatar">AI</span>
        <span class="tdot"></span><span class="tdot"></span><span class="tdot"></span>
        <span id="typingLabel">AI 正在发起人机器上处理中，完成后这里会显示结果</span>
      </div>
      <div id="inputArea" style="display:none">
        <div id="taGrip" title="上下拖动改输入框高度，双击恢复成跟着内容长"></div>

<script>
const TOKEN = new URLSearchParams(location.search).get("t") || "";
// 单会话直连模式：/s/<会话ID>?t=<会话令牌>，只能看到/回复这一个会话
const PATH_SID = (location.pathname.match(/^\/s\/([0-9a-zA-Z]+)/) || [])[1] || "";
// ?sid= ：推送点开时用总令牌打开完整页面，同时直接跳到叫你的那个会话
let WANT_SID = new URLSearchParams(location.search).get("sid") || "";
let state = { sessions: [] };
let activeId = null;
let seenRev = {};
let selected = [];
let images = [];
let files = [];              // {name, data(dataURL), size} 任意类型文件
const sending = new Set();   // 正在发送中的会话 id（在途闸，见 doSend）
const MAX_FILE_MB = 30;      // 单文件上限
const MAX_TOTAL_MB = 50;     // 单次发送总上限（服务端请求体限 64MB，base64 有 1/3 膨胀）
let myQids = new Set();      // 本人排队消息，允许撤回
let toastTimer = null;
let offline = false;
let nick = localStorage.getItem("share_nick") || "";
let quickPhrases = [];       // 快捷短语（/api/state 下发，与控制台一致）

const $ = id => document.getElementById(id);

/* 手机上「点了没反应、要连点好几下」的通病：页面轮询重建 DOM/重排列表时，
   触摸序列被打断，iOS 就不再补发 click。曾经的对策是 pointerdown 立即执行，
   但那让「按下就算数」，手指落在会话 tab 或发送键上往下一划本想滚动，却当场
   触发了——用户原话「在会话tab页的时候，还是容易误触」。
   病根其实是每拍重建 DOM，而列表早已改成原地打补丁，不需要这个偏方了。

   现在：鼠标仍旧按下即生效（桌面那份「按下就换」的手感保住）；
   触摸要等抬手，且中途位移不超过 TAP_SLOP、按住不超过 TAP_MAX_MS 才算数。
   浏览器判定为滚动时会送来 pointercancel，那一下直接作废。 */
const TAP_SLOP = 10, TAP_MAX_MS = 700;

function tapBind(el, fn) {
  let last = 0, sx = 0, sy = 0, st = 0, armed = false;
  const run = ev => {
    if (el.disabled) return;
    const now = Date.now();
    if (now - last < 600) return;   // 吞掉浏览器随后补发的 click，别执行两遍
    last = now;
    fn(ev);
  };
  el.addEventListener("pointerdown", e => {
    if (e.button !== 0) return;
    if (e.pointerType === "mouse") { armed = false; run(e); return; }
    sx = e.clientX; sy = e.clientY; st = Date.now(); armed = true;
  });
  el.addEventListener("pointermove", e => {
    if (armed && Math.hypot(e.clientX - sx, e.clientY - sy) > TAP_SLOP) armed = false;
  });
  el.addEventListener("pointercancel", () => { armed = false; });
  el.addEventListener("pointerup", e => {
    if (!armed) return;
    armed = false;
    if (Date.now() - st > TAP_MAX_MS) return;   // 长按另有用途（会话 tab 长按=菜单）
    run(e);
  });
  el.addEventListener("click", run);
}

async function copyText(t) {
  // 手机看分享页走的是 http://<局域网IP>（非 localhost 非 HTTPS）= 非安全上下文，
  // navigator.clipboard 整个不存在（08-12 用户实测：点「复制接手提示词」直接失败）。
  try { await navigator.clipboard.writeText(t); return true; } catch (e) {}
  // 降级 execCommand：HTTP 下多数手机浏览器仍认。readonly 防 iOS 弹键盘，
  // setSelectionRange 是 iOS Safari 选中生效的必要条件。
  try {
    const ta = document.createElement("textarea");
    ta.value = t;
    ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;left:-9999px;top:0;opacity:0";
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    ta.setSelectionRange(0, t.length);
    const ok = document.execCommand("copy");
    ta.remove();
    return ok;
  } catch (e) { return false; }
}

/* 两条复制路都被浏览器拒了（部分 WebView 连 execCommand 都禁）时的最后一条路：
   把全文摆出来让用户长按选择复制。对「接手提示词」这种长文本尤其要紧——
   手机上这里是唯一能拿到内容的地方，只回一句「复制失败」等于死胡同。 */
function showCopyFallback(title, text) {
  let m = document.getElementById("copyFallback");
  if (!m) {
    m = document.createElement("div");
    m.id = "copyFallback";
    m.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:120;"
      + "display:flex;align-items:center;justify-content:center;padding:14px";
    m.innerHTML =
      '<div style="background:var(--bg-2);border:1px solid var(--border);border-radius:14px;'
      + 'max-width:680px;width:100%;max-height:82vh;padding:12px;display:flex;flex-direction:column;gap:8px">'
      + '<div id="cfTitle" style="font-weight:600;font-size:13.5px"></div>'
      + '<div style="font-size:11px;color:var(--text-3)">浏览器不给剪贴板权限，请长按下面的文字手动全选复制</div>'
      + '<textarea id="cfText" readonly style="flex:1;min-height:44vh;background:var(--bg-3);'
      + 'color:var(--text);border:1px solid var(--border);border-radius:9px;padding:8px;'
      + 'font-size:12px;line-height:1.5;box-sizing:border-box;-webkit-user-select:text;user-select:text"></textarea>'
      + '<div style="display:flex;gap:8px;justify-content:flex-end">'
      + '<button id="cfAll" style="background:var(--bg-3);color:var(--text);border:1px solid var(--border);'
      + 'border-radius:9px;padding:8px 14px;font-size:12.5px">全选</button>'
      + '<button id="cfClose" style="background:var(--bg-3);color:var(--text);border:1px solid var(--border);'
      + 'border-radius:9px;padding:8px 14px;font-size:12.5px">关闭</button></div></div>';
    document.body.appendChild(m);
    m.addEventListener("click", e => { if (e.target === m) m.style.display = "none"; });
    m.querySelector("#cfClose").onclick = () => { m.style.display = "none"; };
    m.querySelector("#cfAll").onclick = () => {
      const ta = m.querySelector("#cfText");
      ta.focus(); ta.select();
      try { ta.setSelectionRange(0, ta.value.length); } catch (e) {}
    };
  }
  m.querySelector("#cfTitle").textContent = title || "手动复制";
  m.querySelector("#cfText").value = text || "";
  m.style.display = "flex";
}

/* 复制；被拒就开手动复制浮层。label 给 toast 和浮层标题用。 */
async function copyOrShow(label, text) {
  if (await copyText(text)) { toast(label + "已复制", true); return true; }
  showCopyFallback(label + "（手动复制）", text);
  return false;
}

/* AI 代码块一键复制（与控制台一致） */
function addCodeCopyButtons(bubble) {

/* 语法高亮改成「滚到眼前才染」：手机上一条长回复里十几个代码块，
   进屏前全量 highlightElement 能卡住主线程半秒，切会话时尤其明显。 */
function highlightNow(code) {
  if (code.dataset.hl || !window.hljs) return;
  code.dataset.hl = "1";
  try { hljs.highlightElement(code); } catch (e) { /* 未知语言原样展示 */ }
}
// 再长的代码块就不染了：单块几百毫秒，手机上这一下就是肉眼可见的卡，
// 不染也只是少了配色，内容照样能看。
const HL_MAX_CHARS = 3000;
const hlQueue = [];
let hlPending = false;
// 排在浏览器的空闲档里跑，别跟手指抢主线程（切会话那一帧尤其抢不起）
const idleRun = window.requestIdleCallback
  ? fn => requestIdleCallback(fn, { timeout: 1500 })
  : fn => setTimeout(() => fn(null), 24);
function drainHl(deadline) {
  hlPending = false;
  const t0 = performance.now();
  // 每轮最多占 12ms，且浏览器说没空了就立刻收手；剩下的排到下一个空闲档
  do { highlightNow(hlQueue.shift()); }
  while (hlQueue.length && performance.now() - t0 < 12
         && deadline && deadline.timeRemaining && deadline.timeRemaining() > 4);
  if (hlQueue.length) { hlPending = true; idleRun(drainHl); }
}
const hlObserver = window.IntersectionObserver ? new IntersectionObserver(entries => {
  for (const e of entries) {
    if (!e.isIntersecting) continue;
    hlObserver.unobserve(e.target);
    hlQueue.push(e.target);
  }
  if (hlQueue.length && !hlPending) { hlPending = true; idleRun(drainHl); }
}, { rootMargin: "150px 0px" }) : null;

/* 气泡增强：登记待高亮的代码块 + markdown 内嵌本地图片改走 /api/image 代理 */
function enhanceBubble(bubble, sid) {
  bubble.querySelectorAll("pre code").forEach(code => {
    if (code.dataset.hl || !/language-/.test(code.className)) return;
    if ((code.textContent || "").length > HL_MAX_CHARS) return;
    if (hlObserver) hlObserver.observe(code); else highlightNow(code);
  });
  bubble.querySelectorAll("img").forEach(im => {
    const raw = im.getAttribute("src") || "";
    if (/^([A-Za-z]:[\\/]|\\\\)/.test(raw)) {
      im.src = "/api/image?sid=" + encodeURIComponent(sid)
        + "&path=" + encodeURIComponent(raw) + "&t=" + encodeURIComponent(TOKEN);
    }
    im.loading = "lazy";
    im.decoding = "async";
    im.onerror = () => {
      const n = document.createElement("div");
      n.className = "img-note";
      n.textContent = "📷 图片加载失败";
      im.replaceWith(n);
    };
    if (!im.closest("a")) im.onclick = () => openLightbox(im.src);
  });
}

/* ---- 外链不顶掉 iframe（rxyy tools「持久 MCP」整页嵌住时） ---- */
function isExternalHttpHref(href) {
  return /^(https?:)?\/\//i.test(href || "");
}
function openLinkViewer(url) {
  const box = $("linkview");
  if (!box) return;
  $("linkviewUrl").textContent = url;
  $("linkviewUrl").title = url;
  $("linkviewFrame").src = url;

}
function closeLinkViewer() {
  const box = $("linkview");
  if (!box) return;
  box.style.display = "none";
  $("linkviewFrame").src = "about:blank";
}
function openHttpLinkOutsideFrame(e) {
  const a = e.target && e.target.closest && e.target.closest("a[href]");
  if (!a) return false;
  const href = a.getAttribute("href") || "";
  if (!isExternalHttpHref(href)) return false;
  if (e.defaultPrevented) return false;
  if (typeof e.button === "number" && e.button !== 0) return false;
  if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return false;
  e.preventDefault();
  const url = a.href || href;
  if (typeof openLinkViewer === "function") openLinkViewer(url);
  return true;
}

/* 语音输入：MediaRecorder 录音 → /api/asr（百炼转写）→ 文字进输入框。
   浏览器只在 https / localhost 下开放麦克风；http 链接给出引导而不是装死。 */
let rec = null, recTimer = null, recStart = 0, recChunks = [];
function micSupported() {
  return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
}
function recMime() {
  const cands = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/aac", "audio/ogg;codecs=opus"];
  for (const c of cands) { try { if (MediaRecorder.isTypeSupported(c)) return c; } catch (e) {} }
  return "";
}
async function micToggle() {
  const btn = $("btnMic");
  if (rec) { try { rec.stop(); } catch (e) {} return; }
  if (!micSupported()) {
    alert(location.protocol === "https:"
      ? "这个浏览器不支持录音，请换 Chrome / Safari 试试"
      : "http 链接下手机浏览器不开放麦克风。请改用「远程https·支持语音」链接打开（控制台 tab 右键 → 二维码/直连里有），或点输入框用键盘自带的话筒听写。");
    return;
  }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (e) { alert("麦克风权限被拒绝：请在浏览器设置里允许本页使用麦克风"); return; }
  const mime = recMime();
  recChunks = [];
  try { rec = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream); }
  catch (e) { stream.getTracks().forEach(t => t.stop()); alert("这个浏览器不支持录音（MediaRecorder 创建失败）"); return; }
  rec.ondataavailable = e => { if (e.data && e.data.size) recChunks.push(e.data); };
  rec.onstop = async () => {
    clearInterval(recTimer);
    stream.getTracks().forEach(t => t.stop());
    const blob = new Blob(recChunks, { type: (rec && rec.mimeType) || mime || "audio/webm" });
    rec = null;
    btn.classList.remove("rec");
    if (!blob.size || Date.now() - recStart < 600) { btn.textContent = "🎤"; return; }
    btn.textContent = "⏳";
    btn.disabled = true;
    try {
      const dataUrl = await new Promise((ok, no) => {
        const fr = new FileReader();
        fr.onload = () => ok(fr.result);
        fr.onerror = () => no(new Error("读取录音失败"));
        fr.readAsDataURL(blob);
      });
      const r = await api("/api/asr", { sid: activeId, audio: dataUrl }, 90000);
      if (r.ok && r.text) {
        const ta = $("ta");
        ta.value = ta.value ? (ta.value.replace(/\s+$/, "") + " " + r.text) : r.text;
        ta.dispatchEvent(new Event("input"));  // 触发草稿同步与按钮状态刷新
        toast("已转写 " + r.text.length + " 字，确认后发送", true);
      } else {
        toast((r && r.error) || "转写失败，再试一次");
      }
    } catch (e) {
      toast("转写失败：" + (e.message || e));
    }
    btn.textContent = "🎤";
    btn.disabled = false;
  };
  rec.start();
  recStart = Date.now();
  btn.classList.add("rec");
  btn.textContent = "0s";
  recTimer = setInterval(() => {
    const s = Math.floor((Date.now() - recStart) / 1000);
    btn.textContent = s + "s";
    if (s >= 240) { try { rec && rec.stop(); } catch (e) {} }  // 百炼限 5 分钟/10MB，留余量
  }, 1000);
}
