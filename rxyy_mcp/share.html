}

async function pickTakeoverTarget(sid) {
  const cands = state.sessions.filter(x => x.id !== sid && x.connected);
  const box = $("sheetActs");
  box.innerHTML = "";
  $("sheetTitle").textContent = "谁来接手？";
  $("sheetSub").textContent = "选一个在线的 agent，它会读完记录后用原对话ID接着干";
  // 装了「rxyy-mcp 窗口总线」扩展的 Cursor 窗口：不用等哪个 agent 空下来，直接无头开一个新对话来接
  let instances = [];
  try { const r = await api("/api/ext_instances"); instances = (r && r.ok && r.instances) || []; } catch (e) { instances = []; }
  for (const it of instances) {
    box.appendChild(sheetButton("🪟 新开 Cursor 对话接手（窗口「" + (it.label || "") + "」）",
      "电脑上无头开一个新对话，它报到后接手单自动派过去", async () => {
        let r;
        try { r = await api("/api/takeover_new", { sid: sid, instance: it.id, who: nick }); }
        catch (e) { toast("开新对话失败：" + e.message); return; }
        if (!r || !r.ok) { toast((r && r.error) || "开新对话失败"); return; }
        toast("已在「" + ((r.instance && r.instance.label) || "") + "」开了新对话「" + (r.target || "") + "」，报到后自动派单", true);
        closeSheet();
      }));
  }
  if (!cands.length) {
    if (!instances.length) {
      box.appendChild(sheetButton("（没有在线的 agent）", "先在电脑上开一个待命对话", () => {}));
    }
    return;
  }
  // 正在干活的 agent 接到接手指令只会当成一条插进来的消息，多半继续干完手头
  // 的活才理会（08-12 实测：接手投给干活中的 OA对接，用户以为接手没生效）。
  // 标 ⚠ 垫底，首选「正等你回复」和空闲待命的。
  const kindOf = c => c.pending ? 0
    : ((c.agent_status || c.processing_secs != null) ? 2 : 1);
  cands.sort((a, b) => kindOf(a) - kindOf(b));
  for (const c of cands) {
    const k = kindOf(c);
    box.appendChild(sheetButton(
      (k === 0 ? "🟢 " : k === 2 ? "⚠️ " : "⚪ ") + (c.wtag ? c.wtag + " " : "") + c.name,
      k === 0 ? "正等你回复，会立刻开始"
        : k === 2 ? "正在干活" + (c.agent_activity ? "：" + c.agent_activity : "")
          + "——指令会排队，它很可能干完手头的活才切换，慎选"
        : "空闲，排到它下一次提问时开始",
      async () => {
        let r;
        try { r = await api("/api/takeover", { sid: sid, target: c.id, who: nick }); }
        catch (e) { toast("派接手失败：" + e.message); return; }
        if (!r || !r.ok) { toast((r && r.error) || "派接手失败"); return; }
        toast("已交给「" + r.target + "」" + (r.queued ? "（排队中）" : "（马上开始）"), true);
        closeSheet();
        selectSession(c.id);
      }));
  }
}

async function refreshActive(force) {
  const s = activeSession();
  const msgsBox = $("msgs"), empty = $("empty"), input = $("inputArea"), typing = $("typing");
  if (!s) {
    msgsBox.style.display = "none"; input.style.display = "none";
    typing.style.display = "none"; empty.style.display = "flex";
    $("liveTurn").style.display = "none";
    $("jumpBtn").classList.remove("on");
    return;
  }
  empty.style.display = "none";
  msgsBox.style.display = "";
  input.style.display = "flex";
  // 干活播报：AI 主动上报状态时显示具体动作，否则退回通用「处理中」提示
  const working = s.connected && !s.pending && s.agent_status;
  const isProcessing = working || (s.connected && !s.pending && s.processing_secs != null);
  const tdisp = isProcessing ? "flex" : "none";
  if (typing.style.display !== tdisp) typing.style.display = tdisp;
  if (isProcessing) {
    const lbl = $("typingLabel");
    const txt = working
      ? ("AI · " + s.agent_status + (s.agent_activity ? "：" + s.agent_activity : ""))
      : "AI 正在发起人机器上处理中，完成后这里会显示结果";
    if (lbl && lbl.textContent !== txt) lbl.textContent = txt;
  }
  renderLiveTurn(s);

  const sid = s.id;
  const v = ensureView(sid);
  showView(sid);
  if (!force && v.loaded && v.rev === s.rev) { renderInput(s); return; }
  if (v.fetching) { renderInput(s); return; }
  v.fetching = true;
  let data;
  try { data = await api("/api/messages?sid=" + encodeURIComponent(sid)); }
  catch (e) { return; }
  finally { v.fetching = false; }

  const firstLoad = !v.loaded;
  v.rev = data.rev;
  v.loaded = true;
  if (activeId === sid) seenRev[sid] = data.rev;
  if (firstLoad && data.draft && sid === activeId && !$("ta").value.trim()
      && !(typeof shouldSkipHubDraftRestore === "function"
           && shouldSkipHubDraftRestore(sid, data))) {
    $("ta").value = data.draft;  // 恢复 hub 持久化的草稿（换设备/刷新/重启都还在）
    autoGrow();
  }
  // 撤回那会儿人不在这个会话，内容替他寄存着——他回来了，现在还给他
  if (sid === activeId) drainParkedRestore(sid);

  const stick = firstLoad || force || atBottom(v.el);
  const changed = renderMessages(v, data.messages, sid);
  if (changed && stick) pinBottom(v.el);
  if (activeId === sid) {
    updateJump();
    renderInput(s);
    renderSessions();
  }
}

let mediaRev = 0;   // 图片/附件列表变动计数：没变就不重排缩略图
function bumpMedia() { mediaRev++; }

/* ---------- 实时时间线：agent 在 Cursor 里的每一步（与控制台同源，/api/live_turn） ----------
   只拉当前会话、只在它有动静时（Cursor 正在生成 / 上一拍还 live / 缓存超 60s），
   跟着主轮询走但至少隔 2.5s；隧道上一拍 5~15KB。旧 hub 没这个接口 → 静默不画。 */
const liveTurns = {};
const liveTurnUi = {};
let liveTurnFlight = false;
let liveTurnLast = 0;

function ltUi(sid) {
  if (!liveTurnUi[sid]) liveTurnUi[sid] = { collapsed: null, open: new Set() };
  return liveTurnUi[sid];
}

function ltWantsFetch(s) {
  if (!s || !s.has_cursor) return false;
  if (s.live_generating || s.live_state === "working") return true;
  const cur = liveTurns[s.id];
  if (cur && cur.turn && cur.turn.live) return true;
  return !cur || (Date.now() - cur.at > 60000);
}

async function liveTurnTick() {
  const s = activeSession();
  if (!s || liveTurnFlight || document.hidden || !ltWantsFetch(s)) return;
  if (Date.now() - liveTurnLast < 2500) return;
  liveTurnFlight = true;
  liveTurnLast = Date.now();
  const sid = s.id;
  let r;
  try { r = await api("/api/live_turn?sid=" + encodeURIComponent(sid), null, 15000); } catch (e) { r = null; }
  liveTurnFlight = false;
  liveTurns[sid] = (r && r.ok && r.turn)
    ? { turn: r.turn, now: r.now || Date.now() / 1000, at: Date.now() }
    : { turn: null, now: Date.now() / 1000, at: Date.now() };
  const cur = activeSession();
  if (cur && cur.id === sid) renderLiveTurn(cur);
}

function toggleLiveTurn() {
  const s = activeSession();
  if (!s) return;
  const u = ltUi(s.id);
  const cur = liveTurns[s.id];
  const autoCollapsed = !(cur && cur.turn && cur.turn.live);
  u.collapsed = !(u.collapsed == null ? autoCollapsed : u.collapsed);
  $("ltBody").dataset.paint = "";
  renderLiveTurn(s);
}

function ltToggleStep(sid, id) {
  const u = ltUi(sid);
  if (u.open.has(id)) u.open.delete(id); else u.open.add(id);
  $("ltBody").dataset.paint = "";
  const s = activeSession();
  if (s && s.id === sid) renderLiveTurn(s);
}

const LT_ICONS = { shell: "▶", read: "📄", edit: "✎", search: "🔍", web: "🌐", todo: "☑",
                   agent: "🤖", ask: "❓", mcp: "⚡", tool: "🔧" };
const LT_STATUS = { done: "✓", running: "⟳", error: "✗", cancelled: "⊘" };

function ltSpan(secs) {
  secs = Math.max(0, Math.round(secs || 0));
  if (secs < 60) return secs + "s";
  const m = Math.floor(secs / 60), s = secs % 60;
  if (m < 60) return m + "m" + String(s).padStart(2, "0") + "s";
  return Math.floor(m / 60) + "h" + String(m % 60).padStart(2, "0") + "m";
}

function ltDetail(st) {
  const d = document.createElement("div"); d.className = "lt-detail";
  if (st.diff && st.diff.preview) {
    d.classList.add("diff");
    for (const line of st.diff.preview.split("\n")) {
      const ln = document.createElement("div");
      ln.className = line.startsWith("+") ? "dl-add" : line.startsWith("-") ? "dl-del"
        : line.startsWith("@@") ? "dl-hunk" : "dl-ctx";
      ln.textContent = line;
      d.appendChild(ln);
    }
  } else {
    d.textContent = st.result || st.text || "";
  }
  return d;
}

function renderLiveTurn(s) {
  const box = $("liveTurn");
  if (!box) return;
  const cur = s ? liveTurns[s.id] : null;
  const turn = cur && cur.turn;
  if (!turn || !turn.steps || !turn.steps.length) { box.style.display = "none"; return; }
  const u = ltUi(s.id);
  const collapsed = u.collapsed == null ? !turn.live : u.collapsed;
  box.style.display = "flex";
  $("ltDot").className = "lt-dot" + (turn.live ? " live" : "");
  const last = turn.steps[turn.steps.length - 1];
  $("ltTitle").textContent = turn.live
    ? (last && last.kind === "tool" && last.status === "running" ? "Agent 正在" + last.label + "…" : "Agent 正在回复…")
    : "上一轮";
  const span = (turn.updated_at && turn.started_at) ? ltSpan(turn.updated_at - turn.started_at) : "";
  $("ltMeta").textContent = [turn.total_steps + " 步" + (turn.omitted ? "（最近 " + turn.steps.length + "）" : ""),
                             span, turn.pending_bubbles ? "还有 " + turn.pending_bubbles + " 步在写" : "", "≈8s 延迟"]
    .filter(Boolean).join(" · ");
  // 上下文用量牌（Cursor 记的精确值）：high 档就该在手机上按接手，别等它失忆
  const ctxEl = $("ltCtx"), ctx = turn.context;
  if (ctx && ctx.label) {
    ctxEl.style.display = "";
    ctxEl.className = "lt-ctx " + (ctx.level || "");
    ctxEl.textContent = ctx.label + (ctx.level === "critical" ? " ⚠" : "");
    ctxEl.title = ctx.hint ? ctx.label + "\n" + ctx.hint : ctx.label;
  } else {
    ctxEl.style.display = "none";
  }
  $("ltToggle").textContent = collapsed ? "展开" : "收起";
  const body = $("ltBody");
  body.style.display = collapsed ? "none" : "flex";
  if (collapsed) { body.dataset.paint = ""; return; }
  const paintSig = s.id + ":" + turn.sig + ":" + u.open.size;
  if (body.dataset.paint === paintSig) return;
  body.dataset.paint = paintSig;
  const nearBottom = body.scrollHeight - body.scrollTop - body.clientHeight < 40;
  const frag = document.createDocumentFragment();
  if (turn.omitted) {
    const o = document.createElement("div"); o.className = "lt-omitted";
    o.textContent = "…前面还有 " + turn.omitted + " 步"; frag.appendChild(o);
  }
  const sid = s.id;
  turn.steps.forEach((st, i) => {
    const isLast = i === turn.steps.length - 1;
    const row = document.createElement("div");
    row.className = "lt-step " + st.kind + (st.status ? " " + st.status : "");
    const ico = document.createElement("span"); ico.className = "lt-ico";
    if (st.kind === "tool") {
      ico.textContent = LT_ICONS[st.tool] || LT_ICONS.tool;
      const lbl = document.createElement("span"); lbl.className = "lt-lbl"; lbl.textContent = st.label;
      const sum = document.createElement("span"); sum.className = "lt-sum"; sum.textContent = st.summary || st.name;
      const stt = document.createElement("span"); stt.className = "lt-st " + st.status; stt.textContent = LT_STATUS[st.status] || st.status;
      row.append(ico, lbl, sum, stt);
      if (st.result || st.diff) { row.classList.add("clickable"); tapBind(row, () => ltToggleStep(sid, st.id)); }
      frag.appendChild(row);
      if ((st.result || st.diff) && (u.open.has(st.id) || (isLast && !u.open.has("!" + st.id)))) {
        const d = ltDetail(st);
        if (isLast && !u.open.has(st.id)) tapBind(d, () => { u.open.add("!" + st.id); $("ltBody").dataset.paint = ""; renderLiveTurn(s); });
        frag.appendChild(d);
      }
    } else if (st.kind === "thinking") {
      ico.textContent = "💭";
      const lbl = document.createElement("span"); lbl.className = "lt-lbl"; lbl.textContent = "思考";
      const sum = document.createElement("span"); sum.className = "lt-sum"; sum.textContent = st.text;
      const ms = document.createElement("span"); ms.className = "lt-ms"; ms.textContent = st.ms ? (st.ms / 1000).toFixed(1) + "s" : "";
      row.append(ico, lbl, sum, ms);
      row.classList.add("clickable"); tapBind(row, () => ltToggleStep(sid, st.id));
      frag.appendChild(row);
      if (u.open.has(st.id)) frag.appendChild(ltDetail(st));
    } else if (st.kind === "error") {
      ico.textContent = "⚠";
      const sum = document.createElement("span"); sum.className = "lt-sum"; sum.textContent = st.text;
      row.append(ico, sum); frag.appendChild(row);
    } else {
      ico.textContent = "✎";
      const t = document.createElement("div"); t.className = "lt-text";
      const full = st.text || "";
      const open = u.open.has(st.id) || full.length <= 420 || isLast;
      t.textContent = open ? full : full.slice(0, 400) + " …";
      row.append(ico, t);
      if (full.length > 420 && !isLast) { row.classList.add("clickable"); tapBind(row, () => ltToggleStep(sid, st.id)); }
      frag.appendChild(row);
    }
  });
  body.innerHTML = "";
  body.appendChild(frag);
  if (nearBottom || turn.live) body.scrollTop = body.scrollHeight;
}

/* 输入框随内容长高：手机上写长一点的回复不用在两三行的小窗里摸黑翻。
   拖过 #taGrip 之后改由 taPinned 说了算——人手动定的高度不该被下一次输入冲掉。 */
let taPinned = 0;

/** 输入框最高能到多少，才不至于把消息区压到 keep 像素以下。 */
function taMaxHeight(keep) {
  const main = $("main"), area = $("inputArea"), ta = $("ta");
  if (!main || !area || !ta) return Math.round(innerHeight * 0.34);
  // 输入区里除了输入框还有选项/快捷词/缩略图/按钮行，它们占多少就减多少
  const others = area.offsetHeight - ta.offsetHeight;
  return Math.max(TA_H_MIN, main.clientHeight - others - keep);
}

function autoGrow() {
  const ta = $("ta");
  document.body.classList.toggle("ta-pinned", !!taPinned);
  // 人手动拖出来的高度就照办，消息区留 140px 兜底
  if (taPinned) { ta.style.height = Math.min(taPinned, taMaxHeight(140)) + "px"; return; }
  // 自动长高是页面自作主张，尺度要保守得多：给消息区留住四成，
  // 否则手机上写三行字就把 AI 的回复顶出屏幕（用户原话「直接全被挡了」）
  const keep = Math.max(160, Math.round(($("main") || {}).clientHeight * 0.42 || 160));
  const cap = Math.min(Math.round(innerHeight * 0.34), taMaxHeight(keep));
  ta.style.height = "auto";
  ta.style.height = Math.max(TA_H_MIN, Math.min(ta.scrollHeight + 2, cap)) + "px";
}

/* ---------- 决策卡片（zhi 的 card 参数）：多问 / 每项说明 / 自由输入 / 倒计时代决 ---------- */
const cardAnswers = {};  // sid|cardId -> {qid: {selected:[optId], text}}：没提交前切会话也不丢
const cardTimers = {};   // sid|cardId -> {deadline, iv}

function dcEl(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function renderDecisionCard(s, box) {
  const card = s.card;
  const key = s.id + "|" + card.id;
  const ans = cardAnswers[key] || (cardAnswers[key] = {});
  const wrap = dcEl("div", "dc-card");
  if (card.title) wrap.appendChild(dcEl("div", "dc-title", "🗂 " + card.title));
  const many = card.questions.length > 1;
  card.questions.forEach((q, qi) => {
    const a = ans[q.id] || (ans[q.id] = { selected: [], text: "" });
    const qd = dcEl("div", "dc-q");
    qd.appendChild(dcEl("div", "dc-prompt",
      (many ? (qi + 1) + ". " : "") + (q.prompt || "请选择") + (q.multiple ? "（可多选）" : "")));
    for (const o of q.options) {
      const on = a.selected.includes(o.id);
      const row = dcEl("div", "optrow dc-opt" + (o.recommended ? " rec" : "") + (on ? " checked" : ""));
      row.appendChild(dcEl("span", "box", on ? "✓" : ""));
      const body = dcEl("div", "dc-body");
      body.appendChild(dcEl("span", "dc-label", o.label));
      if (o.detail) body.appendChild(dcEl("div", "dc-detail", o.detail));
      row.appendChild(body);
      tapBind(row, () => {
        if (q.multiple) {
          const i = a.selected.indexOf(o.id);
          if (i >= 0) a.selected.splice(i, 1); else a.selected.push(o.id);
        } else {
          a.selected = on ? [] : [o.id];
        }
        $("options").dataset.key = "";
        renderInput(s);
      });
      qd.appendChild(row);
    }
    if (q.allowFreeText) {
      const inp = dcEl("input", "dc-free");
      inp.type = "text";
      inp.placeholder = q.options.length ? "其他…（自由输入，可与选项同时填）" : "请输入…";
      inp.value = a.text || "";
      inp.oninput = () => { a.text = inp.value; };
      qd.appendChild(inp);
    }
    wrap.appendChild(qd);
  });
  const foot = dcEl("div", "dc-foot");
  const submit = dcEl("button", "primary", "提交决策");
  tapBind(submit, () => submitCard(s, card, "manual", foot));
  foot.appendChild(submit);
  const ad = card.autoDecide || {};
  if (ad.enabled) {
    const delegate = ad.onResolve === "delegate";
    const auto = dcEl("button", "", delegate ? "交给 AI 自定" : "让系统替我决定（采纳推荐）");
    tapBind(auto, () => submitCard(s, card, delegate ? "delegate_system" : "adopt_recommended", foot));
    foot.appendChild(auto);
    const timer = dcEl("span", "dc-timer", "");
    foot.appendChild(timer);
    startCardTimer(s, card, key, timer);
  }
  wrap.appendChild(foot);
  box.appendChild(wrap);
}

async function submitCard(s, card, mode, foot) {
  const sid = s.id;
  const key = sid + "|" + card.id;
  stopCardTimer(key);
  for (const b of foot.querySelectorAll("button")) b.disabled = true;   // 点到了就灰，别连点两遍
  let r;
  try { r = await api("/api/card", { sid: sid, answers: cardAnswers[key] || {}, mode: mode, who: nick }); }
  catch (e) { r = { ok: false, error: e.message || "提交决策失败" }; }
  if (!r || !r.ok) {
    toast(((r && r.error) || "提交决策失败") + sentTag(sid, s));
    $("options").dataset.key = "";
    renderInput(activeSession() || s);
    return;
  }
  delete cardAnswers[key];
  const v = views.get(sid);
  if (v) v.rev = -1;
  await tick(true);
}

function startCardTimer(s, card, key, elTimer) {
  // 到点由 hub 的状态循环代答（手机没开着也生效）；这里只画倒计时，
  // 到点后等下一拍轮询把已答的卡收掉，绝不在界面上再提交一遍
  const ad = card.autoDecide;
  const deadline = s.card_deadline ? s.card_deadline * 1000 : Date.now() + ad.timeoutSec * 1000;
  const t = cardTimers[key] || (cardTimers[key] = {});
  t.deadline = deadline;
  if (t.iv) clearInterval(t.iv);
  const delegate = ad.onResolve === "delegate";
  const paint = () => {
    const left = Math.max(0, Math.round((t.deadline - Date.now()) / 1000));
    elTimer.textContent = left > 0
      ? "⏳ " + left + "s 后" + (delegate ? "交回 AI 自定" : "自动采纳推荐项")
      : "⏳ 已到点，控制台正替你答…";
    if (left <= 0) stopCardTimer(key);
  };
  paint();
  t.iv = setInterval(paint, 1000);
}

function stopCardTimer(key) {
  const t = cardTimers[key];
  if (t && t.iv) clearInterval(t.iv);
  delete cardTimers[key];
}

function renderInput(s) {
  const optBox = $("options");
  const ta = $("ta");
  const canReply = s.connected && s.pending;

  // 卡片按「会话 + 卡片 id」进 key：optBox 是所有会话共用的一个盒子，切会话必须重画
  const optionsKey = JSON.stringify(s.options || []) + "|"
    + (s.card ? s.id + ":" + s.card.id : "") + "|" + canReply + "|" + selected.join("\u0001");
  if (optBox.dataset.key !== optionsKey) {
    optBox.dataset.key = optionsKey;
    optBox.innerHTML = "";
    for (const k of Object.keys(cardTimers)) stopCardTimer(k);   // 旧卡的倒计时别对着已拆掉的节点画
    selected = selected.filter(x => (s.options || []).includes(x));
    const hasCard = !!(canReply && s.card && s.card.questions && s.card.questions.length);
    optBox.classList.toggle("has-card", hasCard);
    if (hasCard) {
      renderDecisionCard(s, optBox);
    } else if (canReply && s.options && s.options.length) {
      for (const o of s.options) {
        const row = document.createElement("div");
        row.className = "optrow" + (selected.includes(o) ? " checked" : "");
        const box = document.createElement("span");
        box.className = "box";
        box.textContent = selected.includes(o) ? "✓" : "";
        row.appendChild(box);
        const label = document.createElement("span");
        label.textContent = o;
        row.appendChild(label);
        tapBind(row, () => {
          const i = selected.indexOf(o);
          if (i >= 0) selected.splice(i, 1); else selected.push(o);
          renderInput(s);
        });
        optBox.appendChild(row);
      }
    }
  }

  const isBusy = s.connected && !s.pending && s.processing_secs != null;
  const isIdle = s.connected && !s.pending && s.processing_secs == null;
  const hasContent = ta.value.trim() || selected.length || images.length || files.length;
  const setDis = (el, v) => { if (el.disabled !== v) el.disabled = v; };
  setDis(ta, !s.connected || isIdle);
  // 在途闸：这一拍轮询照样会重画按钮，不带上它的话灰掉的按钮下一秒就自己亮回来
  const inFlight = sending.has(s.id);
  setDis($("btnSend"), inFlight || !(canReply || isBusy) || !hasContent);
  const sendTxt = isBusy ? "排队" : "发送";
  if ($("btnSend").textContent !== sendTxt) $("btnSend").textContent = sendTxt;
  setDis($("btnFile"), !s.connected || isIdle);
  const contDisp = canReply ? "" : "none";
  if ($("btnContinue").style.display !== contDisp) $("btnContinue").style.display = contDisp;
  setDis($("btnContinue"), !canReply);

  const st = $("status");
  const txt = !s.connected
    ? (s.reconnecting ? "连接闪断，重连中…（稍候即可）"
       : (s.ide_active ? "通道未接 · 对话在 IDE 里仍活跃" : "会话已结束"))
    : isIdle ? "待机中 · 暂无活跃对话"
    : isBusy ? "AI 处理中，消息将排队，就绪后自动发送"
    : hasContent ? "Ctrl+Enter 发送"
    : "等待输入...";
  if (st.textContent !== txt) st.textContent = txt;

  renderQuickBar(s);
  renderImages();
  renderFiles();
}

function renderQuickBar(s) {
  const bar = $("quickBar");
  const canReply = s.connected && s.pending;
  if (!canReply || !quickPhrases.length) {
    if (bar.dataset.key !== "") { bar.innerHTML = ""; bar.dataset.key = ""; }
    return;
  }
  const key = quickPhrases.join("|");
  if (bar.dataset.key === key) return;
  bar.dataset.key = key;
  bar.innerHTML = "";
  for (const p of quickPhrases) {
    const chip = document.createElement("span");
    chip.className = "qp";
    chip.textContent = p;
    chip.title = "点击直接发送";
    tapBind(chip, async () => {
      let r;
      try { r = await api("/api/reply", { sid: s.id, text: p, selected: [], images: [], files: [], who: nick, recallable: true }); }
      catch (e) { toast(e.message || "发送失败"); return; }
      if (r && r.qid) myQids.add(r.qid);
      const v = views.get(s.id);
      if (v) v.rev = -1;
      await tick(true);
    });
    bar.appendChild(chip);
  }
}

function fmtSize(n) {
  if (n < 1024) return n + " B";
  if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
  return (n / 1048576).toFixed(1) + " MB";
}

function renderFiles() {
  const box = $("filePreview");
  if (box.dataset.rev === String(mediaRev)) return;
  box.dataset.rev = String(mediaRev);
  box.innerHTML = "";
  files.forEach((f, i) => {
    const chip = document.createElement("div");
    chip.className = "filechip";
    const name = document.createElement("span");
    name.className = "fname";
    name.textContent = "📎 " + f.name;
    name.title = f.name;
    chip.appendChild(name);
    const size = document.createElement("span");
    size.className = "fsize";
    size.textContent = fmtSize(f.size);
    chip.appendChild(size);
    const rm = document.createElement("span");
    rm.className = "rm";
    rm.textContent = "×";
    rm.onclick = () => {
      files.splice(i, 1); bumpMedia();
      const s = activeSession(); if (s) renderInput(s);
    };
    chip.appendChild(rm);
    box.appendChild(chip);
  });
}

function renderImages() {
  const box = $("imgPreview");
  if (box.dataset.rev === String(mediaRev)) return;
  box.dataset.rev = String(mediaRev);
  box.innerHTML = "";
  images.forEach((img, i) => {
    const d = document.createElement("div");
    d.className = "imgthumb";
    const el = document.createElement("img");
    el.src = img.data;
    el.onclick = () => openLightbox(img.data);
    d.appendChild(el);
    const rm = document.createElement("span");
    rm.className = "rm";
    rm.textContent = "×";
    rm.onclick = () => {
      images.splice(i, 1); bumpMedia();
      const s = activeSession(); if (s) renderInput(s);
    };
    d.appendChild(rm);
    box.appendChild(d);
  });
}

function addFiles(fileList) {
  const s = activeSession();
  if (!s || !s.connected) { toast("当前没有可发送的会话"); return; }
  for (const f of fileList) {
    if (f.size > MAX_FILE_MB * 1048576) {
      toast(f.name + " 超过 " + MAX_FILE_MB + "MB，已跳过");
      continue;
    }
    const rd = new FileReader();
    rd.onload = () => {
      if (f.type && f.type.indexOf("image/") === 0) {
        images.push({ data: rd.result, filename: f.name || null });
      } else {
        files.push({ name: f.name, data: rd.result, size: f.size });
      }
      bumpMedia();
      const cur = activeSession();
      if (cur) renderInput(cur);
    };
    rd.readAsDataURL(f);
  }
}

/* 撤回落回原会话：服务端把原文/图片/文件原样交还，为的是「撤回不等于凭空丢失」，
   这一页原先把整包扔了——手机上撤回一条写了半天的长消息，字和图当场就没了。
   还得放回**这条消息所属的那个会话**：unqueue 那一趟回来时人可能已经切走了，
   往眼前的框里灌等于把这条话改发给别人。人不在就先替他寄存，切回来那一拍再还给他
   ——不敢直接写 hub 草稿，/api/draft 是整段覆盖，会把那边正写着的字冲掉。 */
const parkedRestore = {};   // sid → {text, selected, images, files}

function applyRestore(text, sels, imgs, fls) {
  if (text) $("ta").value = $("ta").value ? ($("ta").value + "\n" + text) : text;
  for (const option of sels) if (!selected.includes(option)) selected.push(option);
  for (const im of imgs) images.push(im);
  for (const f of fls) files.push(f);
  autoGrow();
  bumpMedia();
  const s = activeSession();
  if (s) renderInput(s);
  armDraftSave();           // 撤回回来的字也得落库，否则刷新一下又白撤了
}

function restoreUnqueued(sid, rs) {
  const text = String((rs && rs.text) || "");
  const sels = Array.isArray(rs && rs.selected) ? rs.selected : [];
  const imgs = Array.isArray(rs && rs.images) ? rs.images : [];
  const fls = Array.isArray(rs && rs.files) ? rs.files : [];
  if (!text && !sels.length && !imgs.length && !fls.length) return;
  const cur = activeSession();
  if (cur && cur.id === sid) { applyRestore(text, sels, imgs, fls); return; }
  const p = parkedRestore[sid] || { text: "", selected: [], images: [], files: [] };
  parkedRestore[sid] = {
    text: p.text ? (text ? p.text + "\n" + text : p.text) : text,
    selected: [...new Set((p.selected || []).concat(sels))],
    images: p.images.concat(imgs),
    files: p.files.concat(fls),
  };
  toast("已撤回，内容替你留着，切回那个会话就还给你");
}

/** 人切回来了：把撤回时替他寄存的那份放回框里。 */
function drainParkedRestore(sid) {
  const p = parkedRestore[sid];
  if (!p) return;
  delete parkedRestore[sid];
  applyRestore(p.text, p.selected || [], p.images, p.files);
}

/* 在途闸：一次发送没回来之前，这个会话不许再发第二次。
   tapBind 只吞掉 600ms 内的重复点，而带附件的一次往返上面给了 60 秒起步的
   超时——手机上等一两秒没反应，人一定会再点一下，同一条消息连人带图发两遍。
   闸按会话记（sending），别让 A 会话的发送把 B 会话也锁上。 */
/* 草稿落库：定时器点火时才去问「现在开着的是谁」会串台——人在张三那儿打了字、
   0.8 秒内切去李四，这一枪就打在李四身上，而 selectSession 换会话时已经把输入框
   清空了，于是李四存在 hub 里的草稿被写成空字符串（手机上刷一下就再也回不来），
   张三刚打的那半句则一个字都没存下。arm 的那一刻把会话和内容一起钉死，
   切会话之前先把它补出去。 */
let draftTimer = null, draftPend = null;
const draftSaved = {};   // sid → 最近一次真写进 hub 的那一段（发送落地后算余量用）

function postDraft(sid, text) {
  if (!sid) return;
  draftSaved[sid] = text;
  api("/api/draft", { sid: sid, text: text }).catch(() => {});
}

function armDraftSave() {
  const cur = activeSession();
  if (!cur) return;
  draftPend = { sid: cur.id, text: $("ta").value };
  clearTimeout(draftTimer);
  draftTimer = setTimeout(flushDraftSave, 800);  // 停顿 0.8s 落一次，刷新/换设备不丢
}

function flushDraftSave() {
  clearTimeout(draftTimer);
  draftTimer = null;
  const p = draftPend;
  draftPend = null;
  if (p) postDraft(p.sid, p.text);
}

/** 已经发出去的那一段从草稿里减掉，剩下的还是这个会话的草稿。 */
function draftLeftover(text, sent) {
  text = String(text == null ? "" : text);
  if (text === sent) return "";
  return (sent && text.startsWith(sent)) ? text.slice(sent.length) : text;
}

const draftHold = Object.create(null);
function holdDraftEcho(sid) { draftHold[sid] = true; }
function shouldSkipHubDraftRestore(sid, data) {
  if (!draftHold[sid]) return false;
  const empty = !(data && (data.draft
      || (data.draft_images && data.draft_images.length)
      || (data.draft_files && data.draft_files.length)));
  if (empty) delete draftHold[sid];
  return true;
}

async function doSend(isContinue) {
  const s = activeSession();
  if (!s || !s.connected) return;
  if (sending.has(s.id)) return;
  // 发给谁，出发时就钉死。带附件那一趟要几十秒，人完全来得及切去别的会话；
  // 回来再读 activeSession() 就成了「拿李四的框当张三的框收拾」（见下面落地那段）
  const sid = s.id;
  // 发出去的到底是哪一段，先钉住：往返期间输入框还能继续打字/粘图，
  // 回来无脑清空就会把人刚打的下一句一起吞掉
  const sentText = $("ta").value;
  const sentImages = images.slice();
  const sentFiles = files.slice();
  let r;
  sending.add(sid);
  renderInput(s);        // 按钮当场灰掉，人才知道点到了
  try {
    if (isContinue) {
      if (!s.pending) return;
      try { r = await api("/api/reply", { sid: sid, is_continue: true, who: nick }); }
      catch (e) { toast(e.message || "发送失败"); return; }
    } else {
      const totalBytes = sentFiles.reduce((a, f) => a + f.size, 0);
      if (totalBytes > MAX_TOTAL_MB * 1048576) {
        toast("附件总大小超过 " + MAX_TOTAL_MB + "MB，请分多次发送");
        return;
      }
      const payloadFiles = sentFiles.map(f => ({ name: f.name, data: f.data }));
      // 传大附件慢，给足时间；否则 20s 超时会把成功的一次也判成失败
      const wait = 60000 + Math.round(totalBytes / 1024) * 20;
      try {
        if (!s.pending) {
          r = await api("/api/queue", { sid: sid, text: sentText, selected, images: sentImages, files: payloadFiles, who: nick, recallable: true }, wait);
          if (r && r.ok) {
            if (r.qid) myQids.add(r.qid);
            toast("发送缓冲中，5 秒内可撤回" + sentTag(sid, s), true);
          }
        } else {
          r = await api("/api/reply", { sid: sid, text: sentText, selected, images: sentImages, files: payloadFiles, who: nick, recallable: true }, wait);
        }
        if (r && r.qid) myQids.add(r.qid);
      } catch (e) { toast((e.message || "发送失败") + sentTag(sid, s)); return; }
    }
  } finally {
    // 闸放开就得当场重画：按钮的 disabled 只在 renderInput 里算，不补这一下，
    // 发失败后它要一直灰到下一拍轮询（全待机时 4 秒，人以为点不动了）。
    // 画的是「此刻开着的那个」——人切走了还照旧会话画，选项会当场画错。
    sending.delete(sid);
    const cur0 = activeSession();
    renderInput(cur0 || s);
  }
  if (!r || !r.ok) { toast(((r && r.error) || "发送失败") + sentTag(sid, s)); return; }
  holdDraftEcho(sid);
  const cur = activeSession();
  if (!cur || cur.id !== sid) {
    // 人已经切到别的会话了：输入框里现在装的是**它**的草稿，一个字都不能动，
    // 更不能把它当成本会话的余量推回 hub——那样旧会话的草稿会变成新会话的字，
    // 而旧会话那条链接是发给同事的，等于把没写完的话递了出去。
    // 本会话的余量从「切走那一刻替它存进 hub 的那一段」里减掉已发出去的算。
    const kept = draftSaved[sid] == null ? sentText : draftSaved[sid];
    postDraft(sid, draftLeftover(kept, sentText));
    const v0 = views.get(sid);
    if (v0) v0.rev = -1;
    await tick(true);
    return;
  }
  // 只收走真正发出去的那一段，往返期间新打的字留在框里
  $("ta").value = draftLeftover($("ta").value, sentText);
  autoGrow();
  selected = [];
  images = images.filter(x => !sentImages.includes(x));
  files = files.filter(x => !sentFiles.includes(x));
  bumpMedia();
  renderInput(cur);      // 内容刚被收走，按钮要跟着灰回去，别等下一拍
  // 已发送，hub 侧草稿同步成框里还剩的那截（无脑清空会把新打的字弄丢）
  postDraft(sid, $("ta").value);
  const v = views.get(sid);
  if (v) v.rev = -1;
  await tick(true);
}

/** 人已经切走时，提示里带上「发给谁」，否则这行字挂在别人的框下面就是误导。 */
function sentTag(sid, s) {
  const cur = activeSession();
  if (cur && cur.id === sid) return "";
  return "（发给" + ((s && s.name) || sid) + "）";
}

/* 上一拍状态包的摘要。带着它去问，内容没变服务端就只回一句「没变」——
   压缩管的是「这一包多大」，管不了「绝大多数拍其实什么都没发生」。 */
let stateEtag = "";

/* 公网 https 链接被 LAN-first 302 到 http://192.168.x.x 之后，地址栏就钉在
   私网 IP 上。HTTPS→HTTP 不带 Referer；手机一切 4G / 人一离开这张网，轮询
   全打到死地址，红条看起来像「会话不在线」。pub= / SHARE_PUBLIC_BASE 是
   服务端塞的公网基址；没有的话才用家机约定域名兜底。 */
function isPrivateHost(host) {
  const h = String(host || "").toLowerCase().split("%")[0];
  if (h === "localhost") return true;
  const m = h.match(/^(\d+)\.(\d+)\.(\d+)\.(\d+)$/);
  if (!m) return false;
  const a = +m[1], b = +m[2];
  return a === 10 || a === 127
    || (a === 192 && b === 168)
    || (a === 172 && b >= 16 && b <= 31)
    || (a === 100 && b >= 64 && b <= 127);
}

function readPubBase() {
  const q = new URLSearchParams(location.search).get("pub") || "";
  if (/^https:\/\//i.test(q)) {
    const trimmed = q.replace(/\/$/, "");
    try { localStorage.setItem("share_public_base", trimmed); } catch (e) {}
    return trimmed;
  }
  const injected = String(window.SHARE_PUBLIC_BASE || "").replace(/\/$/, "");
  if (/^https:\/\//i.test(injected)) return injected;
  try {
    const stored = (localStorage.getItem("share_public_base") || "").replace(/\/$/, "");
    if (/^https:\/\//i.test(stored)) return stored;
  } catch (e) {}
  // 家机分享站端口约定 39080；hub 尚未热加载注入脚本时，剪贴板局域网链接靠这条救
  if (String(location.port || "") === "39080") return "https://example.invalid";
  return "";
}

function publicBounceUrl() {
  if (!isPrivateHost(location.hostname)) return "";
  const base = readPubBase();
  if (!base) return "";
  try {
    if (location.origin.replace(/\/$/, "") === base) return "";
    const u = new URL(location.pathname + location.search, base + "/");
    u.searchParams.delete("pub");
    u.searchParams.set("nolan", "1");
    return u.toString();
  } catch (e) { return ""; }
}

function bounceLanToPublic() {
  const dest = publicBounceUrl();
  if (!dest) return false;
  location.replace(dest);
  return true;
}

async function tickOnce(force) {
  try {
    const q = PATH_SID ? "/api/state?sid=" + encodeURIComponent(PATH_SID) : "/api/state?";
    let fresh = await api(q + (stateEtag ? "&known=" + stateEtag : ""));
    if (offline) { offline = false; document.body.classList.remove("offline"); }
    if (fresh && fresh.same) {
      // 一个字节都没变，连重绘都省了。force 是人点了刷新，那就照拉不误
      if (!force) return;
      stateEtag = "";
      fresh = await api(q);
    }
    state = fresh;
    stateEtag = fresh.etag || "";
    if (Array.isArray(state.quick_phrases)) quickPhrases = state.quick_phrases;
  } catch (e) {
    if (bounceLanToPublic()) return;
    if (!offline) { offline = true; document.body.classList.add("offline"); renderHeader(); }
    return;
  }
  if (PATH_SID) {
    activeId = state.sessions.find(s => s.id === PATH_SID) ? PATH_SID : null;
  } else {
    if (WANT_SID && state.sessions.find(s => s.id === WANT_SID)) {
      activeId = WANT_SID;
      WANT_SID = "";   // 只在首次落地时跳一次，之后随用户自己切
    }
    if (!activeId && state.sessions.length) activeId = state.sessions[state.sessions.length - 1].id;
    if (activeId && !state.sessions.find(s => s.id === activeId)) {
      activeId = state.sessions.length ? state.sessions[state.sessions.length - 1].id : null;
    }
  }
  renderSessions();
  await refreshActive(force);
}

// 定时、初始加载、发送后的补刷和网络恢复共用一条状态请求链，慢响应不能倒灌旧 state。
let tickFlight = null;
let tickAgain = false;
let tickForce = false;
async function tick(force) {
  if (tickFlight) {
    tickAgain = true;
    tickForce = tickForce || !!force;
    return tickFlight;
  }
  tickForce = tickForce || !!force;
  tickFlight = (async () => {
    do {
      tickAgain = false;
      const runForce = tickForce;
      tickForce = false;
      await tickOnce(runForce);
    } while (tickAgain);
  })();
  try { await tickFlight; }
  finally { tickFlight = null; }
}

/* 轮询节奏自适应。老做法是雷打不动每秒一拍，20 多个会话时 /api/state 有 18KB，
   手机揣兜里也在按秒烧流量和电。现在按「这一拍对你有没有用」分档：
   - 页面被切走/锁屏 → 30s，只够回来时不至于一片空白
   - 你正看着的会话在等你回复 / AI 正在跑 → 1.2s，该快的地方不能慢
   - 只有别的会话在忙（你要的只是那个未读小红点）→ 2.5s
   - 全都待机 → 4s
   再加一道并发闸：上一拍没回来就不发下一拍，隧道抖动时不会堆成一串请求。 */
let pollTimer = null;
let ticking = false;

function pollDelay() {
  if (offline) return 1200;
  if (document.hidden) return 30000;
  const busyOf = s => !!(s.pending || s.processing_secs != null || s.agent_status || s.reconnecting);
  const cur = activeSession();
  if (cur && busyOf(cur)) return 1200;
  return state.sessions.some(busyOf) ? 2500 : 4000;
}

function schedule(ms) {
  clearTimeout(pollTimer);
  pollTimer = setTimeout(loop, ms == null ? pollDelay() : ms);
}

async function loop() {
  if (ticking) { schedule(); return; }
  ticking = true;
  try { await tick(false); }
  catch (e) { /* tick 内部已兜底，这里只保证循环不断 */ }
  try { await liveTurnTick(); }   // 实时时间线跟着主轮询走（内部限 2.5s 一拍、只在有动静时）
  catch (e) { /* 旧 hub 没这个接口 / 链路抖动：面板保持上一拍 */ }
  finally { ticking = false; schedule(); }
}

function askNick(firstTime) {
  $("nickInput").value = nick;
  $("nickModal").style.display = "flex";
  setTimeout(() => $("nickInput").focus(), 50);
  $("nickOk").onclick = () => {
    const v = $("nickInput").value.trim().slice(0, 16);
    if (!v) { if (firstTime) return; }
    else { nick = v; localStorage.setItem("share_nick", nick); }
    $("nickBtn").textContent = "👤 " + (nick || "未命名");
    $("nickModal").style.display = "none";
  };
  $("nickInput").onkeydown = e => { if (e.key === "Enter") $("nickOk").onclick(); };
}

/* 手机手势：从屏幕左缘往右划开会话栏，栏开着往左划关掉。
   只认「明显横向」的手势，免得把代码块的横向滚动和竖向翻页误判掉。 */
function bindSwipe() {
  let sx = 0, sy = 0, tracking = false, decided = false;
  document.addEventListener("touchstart", e => {
    if (e.touches.length !== 1 || document.body.classList.contains("solo")) return;
    sx = e.touches[0].clientX;
    sy = e.touches[0].clientY;
    const open = document.body.classList.contains("drawer");
    tracking = open || sx <= 26;
    decided = false;
  }, { passive: true });
  document.addEventListener("touchmove", e => {
    if (!tracking || decided || e.touches.length !== 1) return;
    const dx = e.touches[0].clientX - sx;
    const dy = e.touches[0].clientY - sy;
    if (Math.abs(dx) < 34 || Math.abs(dx) < Math.abs(dy) * 1.6) return;
    decided = true;
    if (dx > 0) openDrawer(); else closeDrawer();
  }, { passive: true });
  document.addEventListener("touchend", () => { tracking = false; }, { passive: true });
}

window.addEventListener("DOMContentLoaded", () => {
  tapBind($("btnSend"), () => doSend(false));
  tapBind($("btnContinue"), () => doSend(true));
  tapBind($("btnMic"), micToggle);
  document.addEventListener("click", openHttpLinkOutsideFrame, true);
  $("linkviewClose").onclick = closeLinkViewer;
  $("linkviewNew").onclick = () => {
    const url = $("linkviewUrl").textContent || "";
    if (!url) return;
    const w = window.open(url, "_blank", "noopener,noreferrer");
    if (!w && typeof copyText === "function") copyText(url);
    if (!w && typeof toast === "function") toast("弹窗被拦，链接已复制");
  };
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && $("linkview").style.display !== "none") closeLinkViewer();
  });
  $("lightbox").onclick = closeLightbox;
  $("ta").addEventListener("input", () => {
    autoGrow();
    const s = activeSession(); if (s) renderInput(s);
    armDraftSave();   // 停顿 0.8s 把草稿落到 hub，刷新/换设备不丢
  });
  $("ta").addEventListener("keydown", e => {
    if (e.ctrlKey && e.key === "Enter" && !$("btnSend").disabled) doSend(false);
  });
  $("ta").addEventListener("paste", e => {
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    let has = false;
    for (const it of items) {
      if (it.type && it.type.indexOf("image") >= 0) {
        has = true;
        const f = it.getAsFile();
        if (f) {
          const rd = new FileReader();
          rd.onload = () => {
            images.push({ data: rd.result, filename: f.name || null });
            bumpMedia();
            const s = activeSession(); if (s) renderInput(s);
          };
          rd.readAsDataURL(f);
        }
      }
    }
    if (has) e.preventDefault();
  });
  /* 📎 文件不能用 tapBind（pointerdown 触发）：iOS WebKit 在手势未结束、
     还没排除滚动意图前，不授予打开文件选择器的用户手势授权，此时调
     filePick.click() 会被静默忽略；随后浏览器补发的有效 click 又被 tapBind
     的 600ms 去重窗吞掉——手机上表现为「点了没反应」。文件选择器必须由
     完整点按（click）触发；该按钮是常驻节点，click 不会被轮询重建打断。 */
  $("btnFile").addEventListener("click", () => $("filePick").click());
  $("filePick").onchange = e => {
    if (e.target.files && e.target.files.length) addFiles(e.target.files);
    e.target.value = "";
  };
  let dragDepth = 0;
  document.addEventListener("dragenter", e => {
    e.preventDefault();
    if (e.dataTransfer && Array.from(e.dataTransfer.types || []).includes("Files")) {
      dragDepth++;
      $("dropHint").style.display = "flex";
    }
  });
  document.addEventListener("dragleave", e => {
    e.preventDefault();
    if (--dragDepth <= 0) { dragDepth = 0; $("dropHint").style.display = "none"; }
  });
  document.addEventListener("dragover", e => e.preventDefault());
  document.addEventListener("drop", e => {
    e.preventDefault();
    dragDepth = 0;
    $("dropHint").style.display = "none";
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
      addFiles(e.dataTransfer.files);
    }
  });
  $("nickBtn").textContent = "👤 " + (nick || "未命名");
  $("nickBtn").onclick = () => askNick(false);
  $("menuBtn").onclick = openDrawer;
  $("sideClose").onclick = closeDrawer;
  $("scrim").onclick = closeDrawer;
  $("moreBtn").onclick = () => { if (activeId) openSheet(activeId); };
  $("jumpBtn").onclick = () => {
    const v = activeId && views.get(activeId);
    if (v) { pinBottom(v.el); updateJump(); }
  };
  $("qFilter").addEventListener("input", () => {
    filterText = $("qFilter").value.trim().toLowerCase();
    lastOrderSig = "";
    renderSessions();
  });
  $("sheetClose").onclick = closeSheet;
  $("sheet").onclick = e => { if (e.target === $("sheet")) closeSheet(); };
  $("teamBtn").onclick = () => { closeDrawer(); $("teamModal").style.display = "flex"; renderTeam(); };
  $("teamClose").onclick = () => { $("teamModal").style.display = "none"; };
  $("teamDispatch").onclick = renderDispatch;
  $("teamModal").onclick = e => { if (e.target === $("teamModal")) $("teamModal").style.display = "none"; };
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") {
      closeSheet(); closeDrawer(); closeLightbox();
      $("teamModal").style.display = "none";
    }
    // PC 上不摸鼠标也能换会话
    if (e.altKey && (e.key === "ArrowUp" || e.key === "ArrowDown")) {
      const id = neighborSession(e.key === "ArrowUp" ? -1 : 1);
      if (id) { e.preventDefault(); selectSession(id); }
    }
  });
  bindSwipe();
  bindSideGrip();
  bindTaGrip();
  if (PATH_SID) {
    document.body.classList.add("solo");
    $("emptyBig").textContent = "会话不存在或已结束";
    $("emptyHint").textContent = "这条直连链接对应的会话已关闭，请向发起人索取新链接";
    // 单会话令牌按设计只看得见这一个会话，「团队」必然 403：
    // 与其让人点了报错，不如直接不给按钮
    $("teamBtn").style.display = "none";
  }
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) { clearTimeout(pollTimer); loop(); }
    else schedule();
  });
  window.addEventListener("online", () => { clearTimeout(pollTimer); loop(); });
  if (!nick) askNick(true);
  tick(true).finally(() => schedule());
});
</script>
